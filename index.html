<style>
:root{
  --navy:#0b1f4d; --royal:#1d3fae; --royal-2:#2f56d6; --gold:#c9a227; --gold-soft:#f6ecc8;
  --ink:#16213a; --muted:#5b6785; --line:#dde3f0; --bg:#f3f5fa; --card:#fff;
  --ok:#1f8a4c; --ok-soft:#e3f4ea; --bad:#b4232c; --bad-soft:#fbe7e8; --warn:#9a6700; --warn-soft:#fff4d6;
  --prog:#1d3fae; --prog-soft:#e8eeff; --hold:#6b5b95; --hold-soft:#efeaf9;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",Calibri,system-ui,-apple-system,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.stick{position:sticky;top:0;z-index:30;box-shadow:0 2px 10px rgba(11,31,77,.18)}
.top{background:var(--navy);color:#fff;position:relative;overflow:hidden}
.top::after{content:"";position:absolute;right:-50px;top:-40px;width:200px;height:200px;background:linear-gradient(135deg,transparent 46%,rgba(201,162,39,.55) 46% 50%,transparent 50%);pointer-events:none}
.top-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;position:relative;z-index:1}
.top img{width:40px;height:auto;background:#fff;border-radius:8px;padding:3px}
.top h1{font-size:16px;margin:0;line-height:1.2}
.top .sub{font-size:12px;color:#c9d3f2}
.top .who{margin-left:auto;text-align:right;font-size:12px;color:#c9d3f2}
.top .who b{color:#fff;font-size:13px}
.live{display:inline-flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:#3ddc84;box-shadow:0 0 0 0 rgba(61,220,132,.6);animation:pulse 2s infinite}
.dot.off{background:#e5534b;animation:none}
@media (max-width:560px){.top::after{display:none}.top h1{font-size:14px}.top .sub{font-size:11px}.top .who{font-size:11px}.top img{width:32px}nav.tabs button{padding:10px 10px;font-size:14px}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(61,220,132,.6)}70%{box-shadow:0 0 0 7px rgba(61,220,132,0)}100%{box-shadow:0 0 0 0 rgba(61,220,132,0)}}
.goldbar{height:3px;background:var(--gold)}
nav.tabs{background:#fff;border-bottom:1px solid var(--line)}
nav.tabs .in{max-width:1180px;margin:0 auto;padding:0 10px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{background:none;border:0;padding:12px 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;display:flex;gap:6px;align-items:center}
nav.tabs button.on{color:var(--royal);border-bottom-color:var(--gold)}
nav.tabs .badge{background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px}
main{max-width:1180px;margin:0 auto;padding:16px 16px 70px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.card h2{font-size:16px;margin:0 0 10px;color:var(--navy);display:flex;align-items:center;gap:8px}
.card h2 .spacer{flex:1}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g2{grid-template-columns:1fr 1fr}
@media (max-width:860px){.g4{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;border-top:4px solid var(--royal)}
.kpi .n{font-size:28px;font-weight:700;color:var(--navy);line-height:1.1}
.kpi .l{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.kpi .bar{height:6px;background:#e8ecf7;border-radius:99px;margin-top:8px;overflow:hidden}
.kpi .bar i{display:block;height:100%;background:var(--royal)}
.kpi.red{border-top-color:var(--bad)} .kpi.red .n{color:var(--bad)}
.kpi.gold{border-top-color:var(--gold)} .kpi.green{border-top-color:var(--ok)}
.btn{appearance:none;border:0;border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;background:var(--royal);color:#fff;display:inline-flex;align-items:center;gap:6px;line-height:1.2}
.btn:hover{background:var(--royal-2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--royal);border:1px solid #c8d1e6}
.btn.ghost:hover{background:#f2f5fd}
.btn.gold{background:var(--gold);color:var(--navy)}
.btn.green{background:var(--ok)} .btn.red{background:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.lg{padding:12px 18px;font-size:16px}
input[type=text],input[type=password],input[type=search],input[type=date],input[type=datetime-local],select,textarea{width:100%;padding:10px 12px;border:1px solid #c8d1e6;border-radius:10px;background:#fff}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--royal-2);outline-offset:1px;border-color:transparent}
label.lbl{display:block;font-weight:600;font-size:13.5px;margin:10px 0 5px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;white-space:nowrap}
.s-Not-started{background:#eef1f7;color:var(--muted)}
.s-In-progress{background:var(--prog-soft);color:var(--prog)}
.s-Completed{background:var(--ok-soft);color:var(--ok)}
.s-Roadblock{background:var(--bad-soft);color:var(--bad)}
.s-On-hold{background:var(--hold-soft);color:var(--hold)}
.tag{font-size:12px;padding:2px 8px;border-radius:6px;background:#eef1f7;color:var(--muted);white-space:nowrap}
.tag.gold{background:var(--gold-soft);color:#6d5200}
.tag.red{background:var(--bad-soft);color:var(--bad)}
.tag.green{background:var(--ok-soft);color:var(--ok)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid #c8d1e6;background:#fff;border-radius:99px;padding:5px 12px;font-size:13px;cursor:pointer;font-weight:600;color:var(--muted)}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.task{border:1px solid var(--line);border-left:5px solid #c8d1e6;border-radius:12px;padding:12px 14px;margin-top:10px;background:#fff}
.task.st-Completed{border-left-color:var(--ok);background:#fbfefc}
.task.st-Roadblock{border-left-color:var(--bad);background:#fffafa}
.task.st-In-progress{border-left-color:var(--royal)}
.task.st-On-hold{border-left-color:var(--hold)}
.task h3{font-size:15px;margin:0;flex:1;min-width:180px}
.task.st-Completed h3{text-decoration:line-through;text-decoration-color:rgba(31,138,76,.5)}
.task .meta{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.task .note{font-size:13.5px;padding:8px 10px;border-radius:8px;margin:6px 0;background:var(--bad-soft);color:var(--bad)}
.task .note.ok{background:#f3f5fa;color:var(--ink)}
.task .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.sbtn{border:1px solid #c8d1e6;background:#fff;border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600;cursor:pointer}
.sbtn.c{color:var(--ok);border-color:#b9e2c8} .sbtn.c.on,.sbtn.c:hover{background:var(--ok);color:#fff}
.sbtn.r{color:var(--bad);border-color:#f0c4c7} .sbtn.r.on,.sbtn.r:hover{background:var(--bad);color:#fff}
.sbtn.p{color:var(--royal);border-color:#c5d2f5} .sbtn.p.on,.sbtn.p:hover{background:var(--royal);color:#fff}
.sbtn.h{color:var(--hold);border-color:#d6cdea} .sbtn.h.on,.sbtn.h:hover{background:var(--hold);color:#fff}
.sbtn.n{color:var(--muted)} .sbtn.n:hover{background:#eef1f7}
.thread{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.msg{font-size:13.5px;padding:6px 0;border-bottom:1px solid #f0f2f8}
.msg b{color:var(--navy)}
.lrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);background:#fff}
.lrow:last-child{border-bottom:0}
.lrow .nm{font-weight:600}
.lrow .info{flex:1;min-width:0}
.lrow.present{background:#f7fcf9}
.lrow.absent{background:#fff8f8;opacity:.8}
.list{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.bigbtn{min-width:96px;justify-content:center}
.group-h{background:var(--navy);color:#fff;padding:8px 12px;font-weight:600;font-size:13.5px;display:flex;gap:8px;align-items:center}
.group-h .tag{background:rgba(255,255,255,.15);color:#fff}
.seq{width:38px;height:38px;border-radius:50%;background:var(--prog-soft);color:var(--royal);display:grid;place-items:center;font-weight:700;flex:none}
.lrow.called{background:var(--gold-soft)}
.lrow.called .seq{background:var(--gold);color:var(--navy)}
.lrow.done{opacity:.55}
.lrow.done .seq{background:var(--ok);color:#fff}
.stagebox{display:grid;grid-template-columns:1.2fr 1fr;gap:14px}
@media (max-width:860px){.stagebox{grid-template-columns:1fr}}
.now{background:var(--navy);color:#fff;border-radius:14px;padding:18px;position:relative;overflow:hidden}
.now::after{content:"";position:absolute;right:-30px;bottom:-30px;width:140px;height:140px;background:linear-gradient(135deg,transparent 46%,rgba(201,162,39,.6) 46% 52%,transparent 52%)}
.now .l{font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--gold)}
.now .big{font-size:26px;font-weight:700;margin:4px 0}
.now .pr{color:#c9d3f2}
.feed-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #f0f2f8}
.feed-item .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:14px;background:#eef1f7}
.feed-item.announcement{background:var(--gold-soft);border-radius:10px;padding:10px;border:0;margin:6px 0}
.feed-item.announcement .ic{background:var(--gold);color:var(--navy)}
.feed-item.roadblock .ic{background:var(--bad-soft);color:var(--bad)}
.feed-item.checkin .ic{background:var(--ok-soft);color:var(--ok)}
.feed-item.stage .ic{background:var(--prog-soft);color:var(--royal)}
.feed-item .t{font-size:14px}
.feed-item .w{font-size:12px;color:var(--muted)}
.banner{background:var(--gold);color:var(--navy);border-radius:12px;padding:12px 14px;margin-bottom:14px;display:flex;gap:10px;align-items:flex-start;box-shadow:0 4px 14px rgba(201,162,39,.35)}
.banner b{display:block}
.banner button{margin-left:auto;background:rgba(11,31,77,.12);border:0;border-radius:8px;padding:4px 10px;cursor:pointer;font-weight:600}
.toasts{position:fixed;right:14px;bottom:14px;z-index:60;display:flex;flex-direction:column;gap:8px;max-width:360px}
.toast{background:var(--navy);color:#fff;border-radius:12px;padding:10px 14px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:13.5px;border-left:5px solid var(--gold);animation:tin .25s ease-out}
.toast.red{border-left-color:#ff6b6b}.toast.green{border-left-color:#3ddc84}
@media (max-width:560px){.toasts{bottom:auto;top:118px;left:10px;right:10px;max-width:none;pointer-events:none}.toast{padding:8px 12px;font-size:13px;opacity:.96}}
@keyframes tin{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.modal-bg{position:fixed;inset:0;background:rgba(11,31,77,.45);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:#fff;border-radius:16px;padding:18px;width:100%;max-width:520px;max-height:90vh;overflow:auto}
.modal h3{margin:0 0 6px;color:var(--navy)}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th,table.t td{padding:8px;border-bottom:1px solid var(--line);text-align:left}
table.t th{font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.scroll{overflow-x:auto}
.err{background:var(--bad-soft);color:var(--bad);padding:10px 12px;border-radius:10px;margin-top:10px;font-size:14px}
.okm{background:var(--ok-soft);color:var(--ok);padding:10px 12px;border-radius:10px;margin-top:10px;font-size:14px}
.empty{padding:24px;text-align:center;color:var(--muted)}
.center{max-width:460px;margin:30px auto}
.mini-bar{height:8px;border-radius:99px;background:#e8ecf7;overflow:hidden;display:flex}
.mini-bar i{display:block;height:100%}
.foot{text-align:center;color:var(--muted);font-size:12px;padding:20px 0 30px}
.sig{display:block;margin-top:14px;font-size:9px;letter-spacing:.4px;opacity:.38;font-weight:400}
.sig.corner{position:fixed;right:10px;bottom:5px;margin:0;color:#fff;opacity:.32;z-index:2}
@media print{.sig{display:none}}
.foot b{color:var(--navy)}
.hidden{display:none!important}
#tagArea{display:none}
.tpwrap{display:flex;flex-direction:column;gap:10px;align-items:center;max-height:55vh;overflow:auto;background:#eef2fb;border-radius:12px;padding:14px}
.tpimg{display:block;border-radius:6px;box-shadow:0 10px 24px -10px rgba(8,26,69,.55);background:#fff}.tpimg.landscape{width:100%;max-width:440px}.tpimg.portrait{height:340px;max-width:100%}
body.printing-tag > *:not(#tagArea){display:none!important}
body.printing-tag #tagArea{display:block}
.ntag{box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;overflow:hidden;font-family:"Segoe UI",Calibri,Arial,sans-serif;color:#000;page-break-after:always;break-after:page}
.ntag .tg-top{display:flex;align-items:center;gap:1.5mm;font-size:2.4mm;font-weight:600}
.ntag .tg-top img{height:5mm}
.ntag .tg-name{font-weight:800;line-height:1.05;margin:1mm 0}
.ntag .tg-prog{font-size:2.8mm}
.ntag .tg-code{font-weight:900;border:0.5mm solid #000;border-radius:1.5mm;padding:0.5mm 2mm;display:inline-block}
.tagprev{border:1px dashed #9fb0d8;border-radius:8px;padding:6px;background:#fff;display:inline-block}
@media print{
  .top,nav.tabs,.toasts,.noprint,.banner,.foot{display:none!important}
  main{padding:0} .card{border:0;padding:0}
  .lrow{break-inside:avoid}
  body{background:#fff}
}
/* ================= ALUMNI HUB 3D THEME ================= */
:root{ --navy:#081a45; --navy-2:#0d2766; --royal:#1d3fae; --royal-2:#3561e8; --gold:#d4af37; --gold-2:#f3d27a; --gold-soft:#fbf1cf; --bg:#eef2fb; --line:#d9e1f2 }
body{background:
  radial-gradient(1100px 520px at 0% -8%, rgba(53,97,232,.55), transparent 60%),
  radial-gradient(900px 480px at 105% 0%, rgba(212,175,55,.28), transparent 60%),
  linear-gradient(180deg, var(--navy) 0, var(--navy-2) 230px, var(--bg) 230px, var(--bg) 100%);
  background-attachment:fixed}
.top{background:linear-gradient(135deg, rgba(8,26,69,.92), rgba(29,63,174,.85));backdrop-filter:blur(8px);border-bottom:1px solid rgba(243,210,122,.35)}
.top::after{background:linear-gradient(135deg,transparent 46%,rgba(243,210,122,.7) 46% 49%,transparent 49%),linear-gradient(135deg,transparent 56%,rgba(255,255,255,.08) 56% 62%,transparent 62%)}
.top img{box-shadow:0 0 0 2px var(--gold),0 6px 14px rgba(0,0,0,.35);transition:transform .6s;transform-style:preserve-3d}
.top img:hover{transform:rotateY(360deg)}
.brand{display:flex;align-items:center;gap:8px}
.brand h1{font-size:17px;letter-spacing:.3px}
.ver{font-size:10.5px;font-weight:800;letter-spacing:1px;color:var(--navy);background:linear-gradient(180deg,var(--gold-2),var(--gold));padding:2px 7px;border-radius:6px;box-shadow:0 2px 0 #9c7d22}
.evpill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:99px;padding:3px 10px;font-size:12px;cursor:pointer}
.evpill:hover{background:rgba(255,255,255,.18)}
.who .acts{display:flex;gap:6px;justify-content:flex-end;margin-top:4px}
.hbtn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:8px;padding:3px 9px;font-size:12px;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.hbtn:hover{background:rgba(255,255,255,.2)} .hbtn.out{background:linear-gradient(180deg,var(--gold-2),var(--gold));color:var(--navy);border-color:transparent;font-weight:700;box-shadow:0 2px 0 #9c7d22}
.goldbar{height:3px;background:linear-gradient(90deg,transparent,var(--gold),var(--gold-2),var(--gold),transparent)}
nav.tabs{background:transparent;border:0}
nav.tabs .in{padding:10px 12px 4px;gap:8px}
nav.tabs button{border-radius:12px!important;padding:9px 16px!important;transition:transform .15s;background:linear-gradient(180deg,#3563e9,#1d3fae)!important;color:#fff!important;border:1px solid rgba(243,210,122,.55)!important;font-weight:800!important;text-shadow:0 1px 0 rgba(0,0,0,.25);box-shadow:0 4px 0 #0b1f5c,0 10px 18px -8px rgba(0,0,0,.55)!important;}
nav.tabs button:hover{background:linear-gradient(180deg,#4a76f0,#2448c0)!important}
nav.tabs button.on{background:linear-gradient(180deg,#f8dc85,#d4af37)!important;color:#081a45!important;border-color:#fff3c4!important;text-shadow:none;box-shadow:0 4px 0 #9c7d22,0 12px 22px -8px rgba(212,175,55,.85)!important;transform:translateY(-2px)}
nav.tabs button.legacy{background:rgba(255,255,255,.08);color:#dfe6fb;border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:9px 16px;box-shadow:0 3px 0 rgba(0,0,0,.25);transition:transform .15s}
nav.tabs button:hover{transform:translateY(-2px);background:rgba(255,255,255,.14)}
nav.tabs button.on{background:linear-gradient(180deg,var(--gold-2),var(--gold));color:var(--navy);border-color:transparent;box-shadow:0 4px 0 #9c7d22,0 10px 18px -8px rgba(212,175,55,.8)}
.stick{box-shadow:none}
.card{border:0;border-radius:18px;background:linear-gradient(180deg,#fff,#fbfcff);
  box-shadow:0 1px 0 #fff inset,0 2px 4px rgba(8,26,69,.06),0 14px 30px -12px rgba(8,26,69,.28),0 40px 60px -40px rgba(8,26,69,.35)}
.card h2{font-size:16.5px}
.kpi{border:0;border-radius:18px;background:linear-gradient(160deg,#fff 0%,#f4f7ff 100%);position:relative;overflow:hidden;
  box-shadow:0 1px 0 #fff inset,0 6px 0 -1px var(--royal),0 18px 30px -14px rgba(8,26,69,.45);transition:transform .25s,box-shadow .25s;transform:perspective(900px) translateZ(0)}
.kpi::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,rgba(53,97,232,.15),transparent 70%)}
.kpi:hover{transform:perspective(900px) rotateX(6deg) rotateY(-6deg) translateY(-4px)}
.kpi.red{box-shadow:0 1px 0 #fff inset,0 6px 0 -1px var(--bad),0 18px 30px -14px rgba(8,26,69,.45)}
.kpi.gold{box-shadow:0 1px 0 #fff inset,0 6px 0 -1px var(--gold),0 18px 30px -14px rgba(8,26,69,.45)}
.kpi.green{box-shadow:0 1px 0 #fff inset,0 6px 0 -1px var(--ok),0 18px 30px -14px rgba(8,26,69,.45)}
.kpi .n{font-size:32px;text-shadow:0 2px 0 rgba(8,26,69,.08)}
.btn{background:linear-gradient(180deg,var(--royal-2),var(--royal));box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 4px 0 #13297a,0 10px 18px -8px rgba(19,41,122,.7);transition:transform .08s,box-shadow .08s,filter .15s;border-radius:11px}
.btn:hover{filter:brightness(1.08);background:linear-gradient(180deg,var(--royal-2),var(--royal))}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 1px 0 #13297a}
.btn.gold{background:linear-gradient(180deg,var(--gold-2),var(--gold));color:var(--navy);box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 4px 0 #9c7d22,0 10px 18px -8px rgba(156,125,34,.7)}
.btn.green{background:linear-gradient(180deg,#2fb267,#1f8a4c);box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 4px 0 #13603a,0 10px 18px -8px rgba(19,96,58,.7)}
.btn.red{background:linear-gradient(180deg,#d63a44,#b4232c);box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 4px 0 #7f1820}
.btn.ghost{background:linear-gradient(180deg,#fff,#f1f4fc);color:var(--royal);border:1px solid #cdd7ee;box-shadow:0 3px 0 #cdd7ee}
.btn.ghost:active{box-shadow:0 1px 0 #cdd7ee}
.sbtn{border-radius:9px;box-shadow:0 2px 0 #d5ddef;transition:transform .08s}
.sbtn:active{transform:translateY(2px);box-shadow:none}
.task{border-radius:14px;border:0;border-left:6px solid #c8d1e6;box-shadow:0 1px 0 #fff inset,0 8px 18px -12px rgba(8,26,69,.35);transition:transform .2s}
.task:hover{transform:translateY(-2px)}
.list{border:0;border-radius:14px;box-shadow:0 10px 24px -16px rgba(8,26,69,.4)}
.group-h{background:linear-gradient(90deg,var(--navy),var(--royal))}
.now{background:radial-gradient(600px 300px at 0% 0%,rgba(53,97,232,.6),transparent 70%),linear-gradient(135deg,var(--navy),#0f2a72);border-radius:20px;
  box-shadow:0 2px 0 rgba(243,210,122,.5) inset,0 24px 40px -18px rgba(8,26,69,.7);transform:perspective(1000px) rotateX(2deg)}
.now .big{text-shadow:0 3px 0 rgba(0,0,0,.25)}
.seq{box-shadow:0 2px 0 rgba(29,63,174,.25)}
.banner{background:linear-gradient(135deg,var(--gold-2),var(--gold));border-radius:14px;box-shadow:0 4px 0 #9c7d22,0 16px 30px -14px rgba(156,125,34,.8)}
.toast{border-radius:14px;background:linear-gradient(135deg,var(--navy),#14307e);box-shadow:0 16px 30px -10px rgba(0,0,0,.45)}
.modal{border-radius:20px;box-shadow:0 40px 80px -20px rgba(8,26,69,.6);animation:pop .25s ease-out}
@keyframes pop{from{transform:perspective(900px) rotateX(-12deg) translateY(16px);opacity:0}to{transform:none;opacity:1}}
.foot{color:#7b86a3}
/* events */
.evgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin-top:6px}
.evtile{position:relative;border-radius:18px;padding:18px;color:#fff;cursor:pointer;overflow:hidden;min-height:140px;
  background:radial-gradient(400px 200px at 0% 0%,rgba(53,97,232,.7),transparent 70%),linear-gradient(135deg,var(--navy),#14307e);
  box-shadow:0 2px 0 rgba(243,210,122,.45) inset,0 6px 0 #061336,0 22px 34px -16px rgba(8,26,69,.8);transition:transform .25s}
.evtile:hover{transform:perspective(900px) rotateX(7deg) rotateY(-7deg) translateY(-6px)}
.evtile::after{content:"";position:absolute;right:-40px;bottom:-40px;width:150px;height:150px;background:linear-gradient(135deg,transparent 46%,rgba(243,210,122,.6) 46% 51%,transparent 51%)}
.evtile h3{margin:0 0 6px;font-size:17px}
.evtile .m{color:#c9d3f2;font-size:13px}
.evtile .n{position:absolute;left:18px;bottom:14px;font-size:12px;color:var(--gold-2);font-weight:700;letter-spacing:.5px}
.evtile.new{background:linear-gradient(180deg,#fff,#f4f7ff);color:var(--royal);border:2px dashed #b9c6ea;box-shadow:0 10px 24px -16px rgba(8,26,69,.4);display:grid;place-items:center;font-weight:700}
/* ================= AUTH SCENE ================= */
body.auth .stick,body.auth .foot{display:none}
body.auth{background:radial-gradient(900px 600px at 15% 10%,rgba(53,97,232,.65),transparent 60%),radial-gradient(800px 500px at 90% 90%,rgba(212,175,55,.35),transparent 60%),linear-gradient(160deg,#050f2c,#0b1f4d 45%,#132f80);min-height:100vh}
body.auth main{max-width:none;padding:0}
.scene{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr;align-items:center;gap:30px;padding:30px 6vw;perspective:1400px;position:relative;overflow:hidden}
@media (max-width:860px){.scene{grid-template-columns:1fr;padding:22px 16px 40px;align-content:center;gap:18px}
  .hero{text-align:center;display:flex;flex-direction:column;align-items:center}

  .hero .coin .face.back img.capico{border-radius:20%}
  .scene .hero h1{font-size:clamp(20px,6.4vw,28px);white-space:nowrap;text-shadow:0 3px 0 rgba(0,0,0,.25)}
  .scene .hero h1 .ver{font-size:10px}

  catch(e){ if (attempt < 3 && navigator.onLine){ await new Promise(r => setTimeout(r, 800 * (attempt + 1))); return rpc(fn, args, attempt + 1); } netState(false); throw new Error("No internet connection. Check your connection and try again."); }

}

let pulling = false, pullAgain = false;
async function pull(force){
  if (pulling){ pullAgain = true; return; }

  try {
    const v = await rpc("grad_version", {p_code:CODE, p_pin:S.pin});
    S.ok = true; S.lastSync = Date.now();
    if (force || v !== S.version || !S.data){
      const prevLast = S.lastFeedId;
      let fresh;
      if (!S.data || force === "full"){ const d = await rpc("grad_state", {p_code:CODE, p_pin:S.pin}); S.data = d; fresh = prevLast ? d.feed.filter(f => f.id > prevLast) : []; S.maxRev = d.max_rev || 0; }
      else { const d = await rpc("grad_delta", {p_code:CODE, p_pin:S.pin, p_rev:S.maxRev, p_feed:S.lastFeedId}); mergeDelta(d); fresh = d.feed; S.maxRev = Math.max(S.maxRev, d.max_rev || 0); }
      S.version = S.data.version; S.role = S.data.role;
      const newest = S.data.feed.length ? S.data.feed[0].id : 0;
      if (prevLast){
        const mineRecently = Date.now() - S.lastActAt < 8000;
        const others = fresh.filter(f => !(f.actor === S.me && mineRecently));
        others.slice().reverse().slice(-4).forEach(announceItem);
        if (fresh.some(f => /^reset the event/.test(f.text || "")) && force !== "full"){ S.lastFeedId = Math.max(prevLast, newest); pulling = false; S.f.collapsed = {}; return pull("full"); }
        if (fresh.length){ if (S.tab !== "feed"){ S.unseen = (S.unseen||0) + fresh.length; } bounceTab("feed"); }
      }
      S.lastFeedId = Math.max(prevLast, newest);
      render();
    }
  } catch(e){
    S.ok = false;
    if (/Session expired|Incorrect PIN/.test(e.message)){ pulling = false; return logout(true); }
    if (/Event not found/.test(e.message)){ CODE = null; store.del("hub_event"); clearInterval(timer); pulling = false; return eventsView(); }
  }
  pulling = false; liveBadge();
  if (pullAgain){ pullAgain = false; pull(false); }
}

async function authView(msg){
  clearInterval(timer); S.data = null;
  authShell(`<h2>Welcome back</h2><p class="sub">Sign in with your Camblish email address.</p>
    <label class="lbl">Email</label><input type="text" id="em" placeholder="name@camblish.co.za" autocomplete="username">
    <label class="lbl">Password</label><input type="password" id="pw" autocomplete="current-password">
    <button class="btn" id="go">Sign in</button>
    <div id="out">${msg ? `<div class="err">${esc(msg)}</div>` : ""}</div>
    <p class="small muted" style="margin-top:14px">Forgot your password? Ask a Camblish manager to reset it. You'll receive a new temporary password by email.</p>
    <p class="small" id="setupLink" style="margin-top:6px"></p>`);
  const remembered = store.get("hub_email"); if (remembered) $("#em").value = remembered;
  ($("#em").value ? $("#pw") : $("#em")).focus();
  const go = async () => {
    const em = $("#em").value.trim(), pw = $("#pw").value;
    if (!em || !pw) return;
    $("#go").disabled = true; $("#go").textContent = "Signing in…"; audio(); capSpin(true);
    try {
      const r = await rpc("hub_login", {p_email:em, p_password:pw});
      if (!r.ok){ capSpin(false); $("#out").innerHTML = `<div class="err">${esc(r.error)}</div>`; $("#go").disabled=false; $("#go").textContent="Sign in"; return; }
      store.set("hub_email", em.toLowerCase());
      S.celebrate = true; afterAuth(r.token, r);
    } catch(e){ capSpin(false); $("#out").innerHTML = `<div class="err">${esc(e.message)}</div>`; $("#go").disabled=false; $("#go").textContent="Sign in"; }
  };
  $("#go").onclick = go; $("#pw").addEventListener("keydown", e => { if (e.key==="Enter") go(); }); $("#em").addEventListener("keydown", e => { if (e.key==="Enter") $("#pw").focus(); });

/* ---------- ordering ---------- */
function orderKey(a, b){
  const n = (a.nqf ?? 99) - (b.nqf ?? 99); if (n) return n;
  const p = (a.programme||"").localeCompare(b.programme||""); if (p) return p;
  const c = (a.client||"").localeCompare(b.client||""); if (c) return c;
  const s = (a.surname||"").localeCompare(b.surname||""); if (s) return s;
  return (a.first_name||"").localeCompare(b.first_name||"");
}
const groupOf = l => `NQF ${l.nqf ?? "?"} · ${l.programme || "Programme not set"}`;
function stageList(){
  // Groups run NQF level (low to high), then programme. Inside a group it is first come, first on stage.
  const present = S.data.learners.filter(l => l.status === "present");
  const gkey = l => [String(l.nqf ?? 99).padStart(3,"0"), l.programme||""].join("|");
  const keys = [...new Set(present.map(gkey))].sort();
  const t = l => new Date(l.arrived_at || 0).getTime();
  const started = k => present.some(l => gkey(l) === k && l.stage_status !== "waiting");
  // A group is closed once a later group has started: anyone from it who arrives after that goes to the very end.
  const closedAt = {};
  keys.forEach((k, i) => {
    const later = present.filter(l => keys.indexOf(gkey(l)) > i && l.stage_at).map(l => new Date(l.stage_at).getTime());
    closedAt[k] = later.length ? Math.min(...later) : Infinity;
  });
  const main = [], late = [];
  present.forEach(l => { l._late = l.stage_status === "waiting" && t(l) > closedAt[gkey(l)]; (l._late ? late : main).push(l); });
  main.sort((a,b) => keys.indexOf(gkey(a)) - keys.indexOf(gkey(b)) || t(a) - t(b));
  late.sort((a,b) => t(a) - t(b));
  const all = main.concat(late);
  all.forEach((l,i) => l._seq = i+1);
  // Stable tag codes: line number = programme position among ALL programmes on the list, then arrival position in that line
  const lines = [...new Set(S.data.learners.map(gkey))].sort();
  const pos = {};
  main.forEach(l => { const k = gkey(l); pos[k] = (pos[k]||0) + 1; l._code = `${lines.indexOf(k)+1}-${String(pos[k]).padStart(2,"0")}`; l._line = lines.indexOf(k)+1; });
  late.forEach((l,i) => { l._code = `L-${String(i+1).padStart(2,"0")}`; l._line = "Late"; });
  return all;
}

const tagPrefs = () => { const p = Object.assign({size:"86x54", auto:true, orient:"landscape", direct:false}, store.get("tagprefs") || {}); if (!TAG_SIZES[p.size]) p.size = "86x54"; return p; };
const saveTagPrefs = o => store.set("tagprefs", Object.assign(tagPrefs(), o));
let _tagImg = null;
function tagBg(){ return _tagImg || (_tagImg = new Promise(res => { const i = new Image(); i.onload = () => res(i); i.src = TAG_BG; })); }
function fitText(ctx, text, maxW, size, font){ let s = size; do { ctx.font = font.replace("{s}", s); if (ctx.measureText(text).width <= maxW) break; s -= 1; } while (s > 8); return s; }
async function renderTag(l){
  const sz = TAG_SIZES[tagPrefs().size];
  const dpi = 300, W = Math.round(sz.w / 25.4 * dpi), H = Math.round(sz.h / 25.4 * dpi);
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, W, H);
  const name = [l.first_name, l.surname].filter(Boolean).join(" ").toUpperCase();
  const year = (S.data && S.data.event.date ? new Date(S.data.event.date) : new Date()).getFullYear();
  const prog = [l.programme, l.nqf ? "NQF " + l.nqf : ""].filter(Boolean).join("  ·  ");
  const cli = [l.client, year].filter(Boolean).join("  ·  ");
  try { await document.fonts.load('40px "Archivo Black"'); await document.fonts.load('700 20px Montserrat'); } catch {}
  if (sz.colour){
    const bg = await tagBg();
    const k = Math.min(W / 612, H / 366), ox = (W - 612 * k) / 2, oy = (H - 366 * k) / 2;   // design space 612 x 366
    x.drawImage(bg, ox, oy, 612 * k, 366 * k);
    const X = v => ox + v * k, Y = v => oy + v * k;
    x.textAlign = "center"; x.textBaseline = "alphabetic"; x.fillStyle = "#0d2a6b";
    const ns = fitText(x, name, (l.seat || l._code ? 350 : 395) * k, Math.round(40 * k), '{s}px "Archivo Black", "Arial Black", Impact, sans-serif');
    x.fillText(name, X(305), Y(285));
    x.fillStyle = "#0d2a6b"; fitText(x, prog, 340 * k, Math.round(14 * k), '800 {s}px Montserrat, "Segoe UI", Arial, sans-serif'); x.fillText(prog, X(305), Y(323));
    x.fillStyle = "#1d3fae"; fitText(x, cli, 340 * k, Math.round(13 * k), '700 {s}px Montserrat, "Segoe UI", Arial, sans-serif'); x.fillText(cli, X(305), Y(342));
    if (l.seat || l._code){   // seat + stage number badge, bottom left
      const bx = X(14), by = Y(282), bw = 100 * k, bh = 70 * k, r = 11 * k;
      x.beginPath(); x.roundRect(bx, by, bw, bh, r); x.fillStyle = "#081a45"; x.fill(); x.lineWidth = 3 * k; x.strokeStyle = "#d4af37"; x.stroke();
      x.fillStyle = "#f3d27a"; x.font = `800 ${Math.round(8 * k)}px Montserrat, Arial, sans-serif`; x.fillText(l.seat ? "SEAT" : "STAGE No.", bx + bw / 2, by + 14 * k);
      const big = l.seat || l._code;
      x.fillStyle = "#fff"; fitText(x, big, bw - 12 * k, Math.round(26 * k), '{s}px "Archivo Black", "Arial Black", sans-serif'); x.fillText(big, bx + bw / 2, by + 42 * k);
      if (l.seat && l._code){ x.fillStyle = "#f3d27a"; x.font = `700 ${Math.round(9 * k)}px Montserrat, Arial, sans-serif`; x.fillText("STAGE " + l._code, bx + bw / 2, by + 60 * k); }
    }
  } else {   // simple black design for small thermal labels
    const pad = W * 0.04; x.fillStyle = "#000"; x.textAlign = "left";
    x.font = `700 ${Math.round(H * 0.11)}px Montserrat, Arial, sans-serif`; x.fillText((S.data ? S.data.event.name : "Camblish Graduation"), pad, H * 0.16);
    fitText(x, name, W - 2 * pad, Math.round(H * 0.26), '{s}px "Archivo Black", "Arial Black", sans-serif'); x.fillText(name, pad, H * 0.48);
    x.font = `700 ${Math.round(H * 0.1)}px Montserrat, Arial, sans-serif`; x.fillText(prog, pad, H * 0.66); x.fillText(cli, pad, H * 0.8);
    const big = l.seat ? "SEAT " + l.seat : l._code;
    if (big){ x.textAlign = "right"; fitText(x, big, W * 0.45, Math.round(H * 0.2), '{s}px "Archivo Black", "Arial Black", sans-serif'); x.fillText(big, W - pad, H * 0.93); }
  }
  return c;
}
/* Printing always opens a preview first, in the orientation the tag printer expects.
   The desktop app can be set to print straight to a chosen tag printer instead. */
function rotateCanvas(c){
  const r = document.createElement("canvas"); r.width = c.height; r.height = c.width;
  const x = r.getContext("2d"); x.translate(r.width, 0); x.rotate(Math.PI / 2); x.drawImage(c, 0, 0); return r;
}
async function printTags(list){
  list = list.filter(Boolean); if (!list.length) return;
  let canvases;
  try { canvases = await Promise.all(list.map(renderTag)); } catch(e){ return toast("Could not build the tag: " + e.message, "red"); }
  const p = tagPrefs();
  if (p.direct && p.printer && DESKTOP() && DESKTOP().print_png){
    const label = list.length > 1 ? list.length + " tags" : "Tag for " + fullName(list[0]);
    const r = await DESKTOP().print_png(canvases.map(c => c.toDataURL("image/png").split(",")[1]), p.printer);
    if (r && r.ok) markPrinted(list);
    return toast(r && r.ok ? `🖨 ${label} sent to ${p.printer}` : "Printing failed: " + (r && r.error), r && r.ok ? "green" : "red");
  }
  tagPreview(list, canvases);
}
function tagPreview(list, canvases){
  const sz = TAG_SIZES[tagPrefs().size];
  const draw = m => { const o = $("#tpo", m).value; $("#tpimgs", m).innerHTML = canvases.map(c => { const src = (o === "portrait" ? rotateCanvas(c) : c).toDataURL("image/png");
      return `<img src="${src}" class="tpimg ${o}" alt="Name tag preview">`; }).join(""); };
  modal(`<h3>Print preview · ${list.length > 1 ? list.length + " name tags" : esc(fullName(list[0]))}</h3>
    <div class="row small" style="gap:10px;flex-wrap:wrap;margin:6px 0 10px"><span>${esc(sz.label)}</span><span class="spacer"></span>
      <label class="row" style="gap:6px">Orientation <select id="tpo" style="width:auto"><option value="landscape">Landscape (wide)</option><option value="portrait">Portrait (tall, tag turned)</option></select></label></div>
    <div id="tpimgs" class="tpwrap"></div>
    <p class="small muted" style="margin:8px 0 0">Press Print, then choose the tag printer in the print window. If the tag comes out sideways, switch the orientation here and print again.</p>
    <div class="row" style="margin-top:12px"><span class="spacer"></span><button class="btn ghost" id="mc">Close</button><button class="btn gold" id="mp">🖨 Print</button></div>`,
    (m, close) => {
      $("#tpo", m).value = tagPrefs().orient || "landscape";
      $("#tpo", m).onchange = () => { saveTagPrefs({orient:$("#tpo", m).value}); draw(m); };
      draw(m);
      $("#mc", m).onclick = close;
      $("#mp", m).onclick = () => { const o = $("#tpo", m).value; close(); sendToPrinter(canvases, o); markPrinted(list); };
    });
}
function sendToPrinter(canvases, orient){
  const sz = TAG_SIZES[tagPrefs().size], w = orient === "portrait" ? sz.h : sz.w, h = orient === "portrait" ? sz.w : sz.h;
  let area = $("#tagArea"); if (!area){ area = document.createElement("div"); area.id = "tagArea"; document.body.appendChild(area); }
  area.innerHTML = `<style>@page{size:${w}mm ${h}mm;margin:0}@media print{html,body{width:${w}mm;height:${h}mm;margin:0!important;padding:0!important;background:#fff!important}}</style>` +
    canvases.map(c => `<img class="ntag" src="${(orient === "portrait" ? rotateCanvas(c) : c).toDataURL("image/png")}" style="width:${w}mm;height:${h}mm;display:block;page-break-after:always;break-after:page">`).join("");
  document.body.classList.add("printing-tag");
  const done = () => { document.body.classList.remove("printing-tag"); window.removeEventListener("afterprint", done); };
  window.addEventListener("afterprint", done);
  setTimeout(() => { window.print(); setTimeout(done, 1500); }, 250);
}
async function previewTag(l){ printTags([l]); }

function drawTasks(){
  const T = S.data.tasks;
  const filters = ["Active","All",...STATUSES];
  $("#tchips").innerHTML = filters.map(f=>{ const n = f==="All"?T.length : f==="Active"?T.filter(t=>t.status!=="Completed").length : T.filter(t=>t.status===f).length; return `<button class="chip ${S.f.taskStatus===f?"on":""}" data-f="${f}">${f} (${n})</button>`; }).join("");
  $$("#tchips .chip").forEach(c => c.onclick = () => { S.f.taskStatus = c.dataset.f; drawTasks(); });
  const q = S.f.taskQ.toLowerCase();
  let list = T.filter(t => (S.f.taskStatus==="All" || (S.f.taskStatus==="Active" ? t.status!=="Completed" : t.status===S.f.taskStatus))
    && (!S.f.taskOwner || (S.f.taskOwner==="__me" ? owners(t).includes(S.me) : owners(t).includes(S.f.taskOwner)))
    && (!q || [t.title,t.details,t.category,t.owner].join(" ").toLowerCase().includes(q)));
  const rank = {Roadblock:0,"In progress":1,"Not started":2,"On hold":3,Completed:4};

    $("#tlist").innerHTML = `<div class="empty">No tasks yet.${can("tasks_create")?`<br><br><button class="btn" id="seed">Load the standard graduation checklist</button>`:""}</div>`;

  wireTasks();
}

/* ======================================================================
   SEATING  (Great Hall: lower section first, clients in left rows AA-CC)
   ====================================================================== */
const HALL = { name:"Great Hall, Wits", sections:[
  { name:"Lower", rows:["AA","BB","CC","DD","EE","FF","GG","HH","II","JJ","KK","LL"],
    blocks:[{name:"Left", from:35, to:25}, {name:"Centre", from:24, to:12}, {name:"Right", from:11, to:1}] },
  { name:"Upper", rows:["A","B","C","D","E","F","G","H","I","J","K","L","M","N","O","P","R"],
    blocks:[{name:"Left", from:44, to:33}, {name:"Centre left", from:32, to:23}, {name:"Centre right", from:22, to:12}, {name:"Right", from:11, to:1}] }],
  reserved: s => s.section === "Lower" && s.block === "Left" && ["AA","BB","CC"].includes(s.row) };
function hallSeats(){
  const out = [];
  HALL.sections.forEach(sec => sec.rows.forEach(r => sec.blocks.forEach(b => { for (let n = b.from; n >= b.to; n--) out.push({section:sec.name, row:r, block:b.name, n, label:`${r}-${n}`}); })));
  out.forEach(s => s.reserved = HALL.reserved(s));
  return out;
}
const seatSort = (a, b) => ((a.nqf ?? 99) - (b.nqf ?? 99)) || (a.programme||"").localeCompare(b.programme||"") || (a.client||"").localeCompare(b.client||"") || (a.surname||"").localeCompare(b.surname||"") || (a.first_name||"").localeCompare(b.first_name||"");
function seatPlan(){
  const L = S.data.learners;
  const keep = L.filter(l => l.seat && l.status === "present"), taken = new Set(keep.map(l => l.seat));
  const out = L.filter(l => l.status === "absent" || /^n/i.test(l.rsvp||""));
  const todo = L.filter(l => !keep.includes(l) && !out.includes(l)).sort(seatSort);
  const free = hallSeats().filter(s => !s.reserved && !taken.has(s.label));
  const plan = new Map();
  todo.forEach((l, i) => plan.set(l.id, free[i] ? free[i].label : ""));
  out.forEach(l => { if (l.status !== "present") plan.set(l.id, ""); });
  return { plan, unseated: Math.max(0, todo.length - free.length), lower: hallSeats().filter(s => s.section === "Lower" && !s.reserved).length };
}
async function assignSeats(){
  if (!confirm("Assign seats by programme? Graduates who are already checked in keep their seats; absent and not-attending graduates give theirs up.")) return;
  try { S.lastActAt = Date.now(); const r = await rpc("grad_seats_assign", {p_code:CODE, p_pin:S.pin, p_actor:S.me});
    toast(`Seats assigned: ${r.seated} seated${r.unseated ? `, ${r.unseated} did not fit in the hall` : ""}`, r.unseated ? "red" : "green"); rtPing(); await pull(true); }
  catch(e){ toast("Could not assign seats: " + e.message, "red"); }
}
function seatStats(){
  const L = S.data.learners, seated = L.filter(l => l.seat);
  const low = new Set(HALL.sections[0].rows);
  return { seated:seated.length, lower:seated.filter(l => low.has(l.seat.split(/[- ]/)[0])).length, upper:seated.filter(l => !low.has(l.seat.split(/[- ]/)[0])).length, none:L.filter(l => !l.seat && l.status !== "absent").length };
}
/* ======================================================================
   GREAT HALL FLOOR PLAN  (interactive copy of the venue plan, with routes)
   ====================================================================== */
const PLAN = { cx:500, cy:2200, pitch:17, lowR:1240, upR:1509, rowH:19,
  layout:{ Lower:[["Left",11],[null,2],["Centre",13],[null,2],["Right",11]], Upper:[["Left",12],[null,2],["Centre left",10],[null,1.5],["Centre right",11],[null,2],["Right",11]] } };
function planRowR(sec, ri){ return (sec === "Lower" ? PLAN.lowR : PLAN.upR) + ri * PLAN.rowH; }
function planUnits(sec){ return PLAN.layout[sec].reduce((a, b) => a + b[1], 0); }
function planAngle(sec, u, r){ return -Math.PI / 2 + (u - planUnits(sec) / 2) * PLAN.pitch / r; }
function planXY(r, th){ return [PLAN.cx + r * Math.cos(th), PLAN.cy + r * Math.sin(th)]; }
function planBlockStart(sec, block){ let u = 0; for (const [b, n] of PLAN.layout[sec]){ if (b === block) return u; u += n; } return 0; }
// every seat with its drawing position
function planSeats(){
  const out = [];
  HALL.sections.forEach(sec => sec.rows.forEach((row, ri) => {
    const r = planRowR(sec.name, ri);
    sec.blocks.forEach(b => { const u0 = planBlockStart(sec.name, b.name); let i = 0;
      for (let n = b.from; n >= b.to; n--, i++){ const th = planAngle(sec.name, u0 + i + .5, r); const [x, y] = planXY(r, th);
        out.push({section:sec.name, row, block:b.name, n, label:`${row}-${n}`, x, y, deg:th * 180 / Math.PI + 90, r, u:u0 + i + .5, reserved:HALL.reserved({section:sec.name, row, block:b.name}) }); } });
  }));
  return out;
}
function planAt(sec, u, ri){ const r = planRowR(sec, ri); return planXY(r, planAngle(sec, u, r)); }
function usherList(){
  const LU = planUnits("Lower"), UU = planUnits("Upper"), mid = (sec, b) => planBlockStart(sec, b) + PLAN.layout[sec].find(x => x[0] === b)[1] / 2;
  const P = (sec, u, ri) => planAt(sec, u, ri).map(v => Math.round(v));
  return [
    ["U1","Main entrance usher (guests)","red",500,352],

const RAMP = { arr:"#9db3ec", robe:"#5577d8", crossed:"#2a47a8", cert:"#0f2462", none:"#e3e8f3", absent:"#b8bfcc" };
function journey(L){
  const p = L.filter(l => l.status === "present");
  return { total:L.length, arrived:p.length, absent:L.filter(l => l.status === "absent").length, robed:p.filter(l => l.robe_issued).length,
    crossed:p.filter(l => l.stage_status === "done").length, cert:p.filter(l => l.cert_issued).length };
}
function ring(val, total, label, color, sub){
  const r = 44, c = 2 * Math.PI * r, f = total ? Math.min(1, val / total) : 0;
  return `<div class="ring"><svg viewBox="0 0 110 110" width="118" height="118" role="img" aria-label="${label}: ${val} of ${total}"><title>${label}: ${val} of ${total}</title>
    <circle cx="55" cy="55" r="${r}" fill="none" stroke="${RAMP.none}" stroke-width="11"/>
    <circle cx="55" cy="55" r="${r}" fill="none" stroke="${color}" stroke-width="11" stroke-linecap="round" stroke-dasharray="${(c*f).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 55 55)" style="transition:stroke-dasharray .6s"/>
    <text x="55" y="53" text-anchor="middle" font-size="22" font-weight="800" fill="#0d1b3e">${total ? Math.round(100*f) : 0}%</text>
    <text x="55" y="71" text-anchor="middle" font-size="11" fill="#5b6785">${val} of ${total}</text></svg>
    <div class="rl">${label}</div><div class="rs">${sub||""}</div></div>`;
}
function funnel(J){
  const steps = [["Expected", J.total, RAMP.none], ["Arrived", J.arrived, RAMP.arr], ["Robed", J.robed, RAMP.robe], ["Crossed the stage", J.crossed, RAMP.crossed], ["Certificate received", J.cert, RAMP.cert]];

}
function progBars(L, limit=40){
  const g = {}; L.forEach(l => { const k = l.programme || "No programme"; (g[k] = g[k] || {nqf:l.nqf ?? 99, L:[]}).L.push(l); });
  const rows = Object.entries(g).sort((a,b) => a[1].nqf - b[1].nqf || a[0].localeCompare(b[0])).slice(0, limit);

function arrivalsChart(L, w=640, h=150){
  const t = L.filter(l => l.arrived_at).map(l => new Date(l.arrived_at).getTime()).sort((a,b) => a-b);
  if (t.length < 2) return `<div class="empty small">The arrivals chart appears once graduates start checking in.</div>`;

  return `<svg viewBox="0 0 ${w} ${h+26}" width="100%" role="img" aria-label="Arrivals every 15 minutes"><title>Arrivals every 15 minutes</title>

    ${bins.map((v,i) => { const bh = max ? (h-16)*v/max : 0, x = 32 + i*bw; return `<rect x="${(x+1).toFixed(1)}" y="${(h-bh).toFixed(1)}" width="${Math.max(2,bw-2).toFixed(1)}" height="${bh.toFixed(1)}" rx="3" fill="${RAMP.robe}"><title>${fmt(start+i*step)}–${fmt(start+(i+1)*step)}: ${v} arrived</title></rect>${v === max ? `<text x="${(x+bw/2).toFixed(1)}" y="${(h-bh-4).toFixed(1)}" text-anchor="middle" font-size="11" fill="#0d1b3e" font-weight="700">${v}</text>` : ""}`; }).join("")}
    ${bins.map((v,i) => i % Math.ceil(n/8) === 0 ? `<text x="${(32+i*bw).toFixed(1)}" y="${h+16}" font-size="10" fill="#5b6785">${fmt(start+i*step)}</text>` : "").join("")}</svg>`;
}

async function reportPdf(name, htmlIn){

      const r = await DESKTOP().save_pdf(name, html);

    }

      await saveFile(name.replace(/\.pdf$/, ".html"), html.replace("</body>", `<script>setTimeout(()=>print(),700)<\/script></body>`), true); return true;
    }

      const done = ok => { window.removeEventListener("message", onMsg); setTimeout(() => f.remove(), 1500); toast(ok ? "PDF downloaded: " + name : "Could not make the PDF. Use Open to print instead.", ok ? "green" : "red"); res(ok); };
      const onMsg = e => { if (e.data && e.data.pdf) done(e.data.pdf === "done"); };

      setTimeout(() => done(false), 60000);

          .then(() => parent.postMessage({pdf:"done"}, "*")).catch(() => parent.postMessage({pdf:"fail"}, "*")); } catch(e){ parent.postMessage({pdf:"fail"}, "*"); } }, 600));<\/script></body>`);

function viewStage(){
  const P = stageList().filter(l => l.robe_issued);
  const robing = S.data.learners.filter(l => l.status === "present" && !l.robe_issued).length;
  const called = P.filter(l=>l.stage_status==="called");
  const waiting = P.filter(l=>l.stage_status==="waiting");
  const done = P.filter(l=>l.stage_status==="done").length;
  const notYet = S.data.learners.filter(l=>l.status==="expected");
  const notYetBy = {}; notYet.forEach(l => { const g = groupOf(l); notYetBy[g] = (notYetBy[g]||0)+1; });
  const late = waiting.filter(l=>l._late);
  // the stage manager can call one programme at a time; inside it, first to arrive goes first
  const progOrder = [...new Set(P.filter(l => l.stage_status !== "done").sort((a,b) => progKey(a).localeCompare(progKey(b))).map(l => l.programme || "No programme"))];
  if (S.f.stageProg && !progOrder.includes(S.f.stageProg)) progOrder.push(S.f.stageProg);
  const sel = S.f.stageProg || "";
  const queue = sel ? waiting.filter(l => (l.programme || "No programme") === sel).sort(byArrival) : waiting;
  const nextUp = queue.slice(0,5);
  const progOpts = progOrder.map(p => { const n = waiting.filter(l => (l.programme || "No programme") === p).length; return `<option value="${esc(p)}" ${p === sel ? "selected" : ""}>${esc(p)} · ${n} waiting</option>`; }).join("");
  let html = bannerHTML() + `<div class="card flowcard noprint"><div id="flow" class="flowwrap"></div></div>

const HMAP = [
  ["first_name", /^(first\s*names?|names?|given\s*names?|learner\s*name)$/],
  ["middle_name", /^(middle\s*names?|second\s*name)$/],
  ["surname", /^(surname|last\s*name|family\s*name)$/],
  ["full_name", /^(full\s*name|name\s*(and|&)\s*surname|learner|graduate)$/],
  ["learner_ref", /(^id$|\bid\s*(no|number)|identity|learner\s*(no|number)|student\s*(no|number)|passport)/],
  ["pm", /(project\s*manager|coordinator|\bpm\b)/],
  ["region", /^(region|province|site|branch)$/],
  ["seta", /^seta$/],
  ["phone", /(contact\s*(no|number)|cell|phone|mobile)/],
  ["rsvp", /(attending|rsvp)/],
  ["robe", /(robe|gown)/],
  ["belt", /belt/],
  ["name_tag", /name\s*tag/],
  ["programme", /(programme|program|qualification|course|learnership)/],
  ["nqf", /(nqf|level)/],
  ["client", /(client|company|employer|sponsor|organisation|organization)/],
  ["cohort", /(cohort|group|class|intake)/],
  ["notes", /(notes?|comments?|remarks?)/]
];
async function importPreview(e){
  const f = e.target.files[0]; if (!f) return;
  const out = $("#imPrev");
  try {
    if (typeof XLSX === "undefined") throw new Error("The spreadsheet reader did not load. Check your internet connection and try again.");
    const wb = XLSX.read(await f.arrayBuffer(), {type:"array"});
    const rows = [];
    wb.SheetNames.forEach(sn => {
      const aoa = XLSX.utils.sheet_to_json(wb.Sheets[sn], {header:1, defval:"", raw:true}).map(r => r.map(c => c === null || c === undefined ? "" : (typeof c === "number" ? String(Math.round(c) === c ? c : c) : String(c))));
      // find header row: first row with 2+ recognised headers
      let hi = aoa.findIndex(r => r.filter(c => HMAP.some(([,re]) => re.test(String(c).trim().toLowerCase()))).length >= 2);
      if (hi < 0) return;
      const map = {};
      aoa[hi].forEach((c, i) => { const h = String(c).trim().toLowerCase(); const m = HMAP.find(([k,re]) => map[k] === undefined && re.test(h)); if (m) map[m[0]] = i; });
      // sheet name as programme / client fallback
      for (let r = hi+1; r < aoa.length; r++){
        const row = aoa[r], g = k => map[k] !== undefined ? String(row[map[k]]).trim() : "";
        let first = g("first_name"), sur = g("surname");
        if (!first && !sur && g("full_name")){ const p = g("full_name").split(/\s+/); sur = p.pop(); first = p.join(" "); }
        if (!first && !sur) continue;
        let ref = g("learner_ref").replace(/\s/g,""); if (/^\d{11,13}$/.test(ref)) ref = "…" + ref.slice(-4);
        let prog = g("programme").replace(/\s+/g," ") || (map.programme===undefined && wb.SheetNames.length>1 ? sn : "");
        let nqf = g("nqf"); if (!/\d/.test(nqf)){ const m = prog.match(/(?:\bNQF\s*|\bLevel\s*|\bL\s*)(\d{1,2})\b/i); if (m) nqf = m[1]; }
        let phone = g("phone").replace(/\s/g,""); phone = phone.split("/").map(x => /^\d{9}$/.test(x) ? "0"+x : x).join(" / ");
        rows.push({ first_name:first, middle_name:g("middle_name"), surname:sur, learner_ref:ref, programme:prog, nqf, client:g("client"), cohort:g("cohort"), notes:g("notes"),
          pm:g("pm"), region:g("region"), seta:g("seta"), phone, rsvp:g("rsvp"), robe:g("robe"), belt:g("belt"), name_tag:g("name_tag") });
      }
    });
    if (!rows.length) throw new Error("No learners found. Make sure the sheet has a heading row with at least First name and Surname.");
    const missing = rows.filter(r=>!r.programme || !String(r.nqf).match(/\d/)).length;
    out.innerHTML = `<div class="okm">Found ${rows.length} graduates in ${esc(f.name)}.</div>
      ${missing?`<div class="err">${missing} row(s) have no programme or NQF level. They will be placed at the end of the stage order until fixed in the file.</div>`:""}
      <div class="scroll" style="max-height:260px;overflow:auto;margin-top:10px"><table class="t"><thead><tr><th>Name</th><th>Programme</th><th>NQF</th><th>Client</th><th>Project manager</th><th>Region</th></tr></thead><tbody>
      ${rows.slice(0,50).map(r=>`<tr><td>${esc(r.first_name+" "+r.surname)}</td><td>${esc(r.programme)}</td><td>${esc(r.nqf)}</td><td>${esc(r.client)}</td><td>${esc(r.pm)}</td><td>${esc(r.region)}</td></tr>`).join("")}</tbody></table></div>
      ${rows.length>50?`<p class="small muted">Showing first 50.</p>`:""}
      <div class="row" style="margin-top:10px"><label class="row small" style="gap:6px"><input type="checkbox" id="imRep"> Replace the whole list instead of adding (attendance already captured will be cleared)</label><span class="spacer"></span><button class="btn" id="imGo">Import ${rows.length} graduates</button></div>`;
    $("#imGo").onclick = async () => {
      const rep = $("#imRep").checked;
      if (rep && S.data.learners.some(l=>l.status!=="expected") && !confirm("Some graduates are already checked in. Replace the list anyway?")) return;
      $("#imGo").disabled = true;
      if (await act("grad_import", {p_rows:rows, p_replace:rep}, `Upload complete`)){ out.innerHTML = `<div class="okm">Done. ${rep ? "The list was replaced." : "New learners were added; anyone already on the list was skipped."}</div>`; }
    };
  } catch(err){ out.innerHTML = `<div class="err">${esc(err.message)}</div>`; }
}
function exportCsv(){

  const opts = [[8,"8 hours (one working day)"],[12,"12 hours"],[24,"24 hours"],[72,"3 days"],[168,"7 days"],[336,"14 days"],[720,"30 days"]];
  body.innerHTML = `<div class="card"><h2>System</h2><p class="small muted" style="margin-top:-4px">Only administrators see this section.</p>
    <div class="setrow"><div><b>How long a sign-in lasts</b><div class="small muted">After this, people are asked to sign in again. Applies to new sign-ins.</div></div><select id="syS" style="max-width:260px">${opts.map(([v,l]) => `<option value="${v}" ${v===h?"selected":""}>${l}</option>`).join("")}${opts.some(o => o[0]===h) ? "" : `<option value="${h}" selected>${h} hours</option>`}</select></div>
    <div class="setrow"><div><b>Live connection</b><div class="small muted">Instant updates between devices, with a check every few seconds as back-up.</div></div><span class="tag ${RT && RT.status === "SUBSCRIBED" ? "green" : ""}">${RT && RT.status === "SUBSCRIBED" ? "Instant ⚡" : "Checking every 2.5 s"}</span></div>
    <div class="setrow"><div><b>Running as</b></div><span class="small">${DESKTOP() ? "Desktop app" : "Web browser"} · Camblish Alumni Hub v1.5</span></div>
    <div class="setrow"><div><b>Web link for phones</b></div><span class="small"><a href="${HUB_URL}" target="_blank" rel="noopener">${HUB_URL.replace("https://","")}</a></span></div></div>`;
  $("#syS").onchange = async e => { try { await rpc("hub_settings_set", {p_token:S.pin, p_session_hours:+e.target.value}); S.user.session_hours = +e.target.value; toast("Saved. New sign-ins will last " + e.target.selectedOptions[0].textContent.toLowerCase(), "green"); } catch(err){ toast(err.message, "red"); } };
}
function setReset(body){
  body.innerHTML = `<div class="card dangerzone"><h2>↺ Reset and start again <span class="tag red">Needs the admin reset password</span></h2>
    <p class="small">Use this after a rehearsal or test run. You choose what to clear: attendance and progress, seats, updates, tasks or the whole learner list. Nothing else is touched. Wrong passwords are reported to the team and lock the reset for 15 minutes after 5 tries.</p>
    <button class="btn red" id="rsBtn">↺ Reset event…</button></div>`;
  $("#rsBtn").onclick = () => resetDialog({progress:true});
}

/* ---------- BOOT ---------- */
function setTab(t){
  if (t === "users" || t === "manage") return openSettings(t === "users" ? "users" : "event");
  S.tab = t; main.innerHTML = ""; S._setDrawn = null;
  try { history.replaceState(null, "", "?e=" + CODE + "#" + t); } catch {}
  if (t === "users") S._usersLoaded = false;
  render(); window.scrollTo(0,0);
}
$$("nav.tabs button").forEach(b => b.onclick = () => setTab(b.dataset.tab));
async function boot(){
  const tok = store.get(TOKEN_KEY);
  if (!tok) return authView();
  try { const r = await rpc("hub_me", {p_token:tok}); afterAuth(tok, r); }
  catch(e){ store.del(TOKEN_KEY); authView(/Session/.test(e.message) ? "Your session has ended. Please sign in again." : e.message); }
}
boot();
</script>
</body>
</html>
