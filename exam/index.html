<style>:root{
  --navy:#0B1F4B; --navy2:#13306e; --royal:#1F4FD1; --royal2:#2f62ea; --gold:#C9A227; --gold2:#e0bb43;
  --bg:#f3f5fa; --card:#ffffff; --ink:#14203a; --muted:#5d6b86; --line:#dfe4ef; --soft:#eef2fb;
  --ok:#17834a; --okbg:#e5f5ec; --warn:#b26a00; --warnbg:#fff4e0; --bad:#c62828; --badbg:#fdecec;
  --radius:10px; --shadow:0 1px 2px rgba(11,31,75,.06),0 4px 14px rgba(11,31,75,.06);
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 'IBM Plex Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--royal)}
h1,h2,h3{margin:0 0 .5rem;line-height:1.25;color:var(--navy)}
h1{font-size:1.6rem}h2{font-size:1.25rem}h3{font-size:1.05rem}
p{margin:.3rem 0 .8rem}
small,.muted{color:var(--muted)}
code,pre,textarea.code{font-family:var(--mono)}
.hidden{display:none!important}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}.row.between{justify-content:space-between}
.grow{flex:1}
.stack>*+*{margin-top:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}

/* top bar */
.topbar{background:var(--navy);color:#fff;display:flex;align-items:center;gap:18px;padding:0 20px;height:58px;position:sticky;top:0;z-index:40;border-bottom:3px solid var(--gold)}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:.2px;white-space:nowrap}
.brand .crest{width:40px;height:40px;object-fit:contain;display:block;flex:none}
.brand.big{gap:14px;font-size:17px}
.brand.big .crest{width:76px;height:76px}
.xbar .brand .crest{width:42px;height:42px}
.brand small{display:block;color:#c8d3f0;font-weight:400;font-size:11px;letter-spacing:.3px}
.nav{display:flex;gap:4px;flex:1}
.nav a{color:#dfe6fb;text-decoration:none;padding:7px 12px;border-radius:7px;font-size:14px}
.nav a.on,.nav a:hover{background:rgba(255,255,255,.12);color:#fff}
.who{font-size:13px;color:#dfe6fb;display:flex;align-items:center;gap:10px}
.who .role{background:var(--gold);color:var(--navy);border-radius:20px;padding:1px 9px;font-size:11px;font-weight:600;text-transform:uppercase}

.wrap{max-width:1180px;margin:0 auto;padding:24px 20px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.card.tight{padding:14px}
.card h2{display:flex;align-items:center;gap:10px}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.pagehead p{margin:0;color:var(--muted)}
.kicker{font-size:12px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--royal)}

/* forms */
label{display:block;font-size:13px;font-weight:600;color:var(--navy);margin:0 0 4px}
.field{margin-bottom:14px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:#fff;border:1px solid #c9d1e3;border-radius:8px;padding:9px 11px;outline:none;transition:border .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--royal);box-shadow:0 0 0 3px rgba(31,79,209,.15)}
input[type=checkbox],input[type=radio]{width:auto}
textarea{min-height:110px;resize:vertical}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:400;font-size:14px;color:var(--ink)}
.check input{margin-top:4px}
.hint{font-size:12.5px;color:var(--muted);margin-top:4px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 14px/1 inherit;font-family:inherit;border:1px solid transparent;border-radius:8px;padding:10px 16px;cursor:pointer;background:var(--royal);color:#fff;text-decoration:none;white-space:nowrap;transition:background .15s,transform .05s}
.btn:hover{background:var(--royal2)}.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.gold{background:var(--gold);color:var(--navy)}.btn.gold:hover{background:var(--gold2)}
.btn.navy{background:var(--navy)}.btn.navy:hover{background:var(--navy2)}
.btn.ghost{background:#fff;color:var(--navy);border-color:#c9d1e3}.btn.ghost:hover{background:var(--soft)}
.btn.danger{background:var(--bad)}.btn.danger:hover{background:#a51f1f}
.btn.ok{background:var(--ok)}
.btn.sm{padding:7px 11px;font-size:13px}
.btn.xs{padding:4px 8px;font-size:12px;border-radius:6px}
.btn.lg{padding:14px 22px;font-size:16px}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:20px;background:var(--soft);color:var(--navy);white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.bad{background:var(--badbg);color:var(--bad)}
.pill.gold{background:#fbf3d8;color:#7a5f00}.pill.blue{background:#e4ebfd;color:var(--royal)}
.dot{width:8px;height:8px;border-radius:50%;background:#9aa6c0;display:inline-block}
.dot.ok{background:#22a35a}.dot.warn{background:#e59b0b}.dot.bad{background:#e53935}

table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:600;border-bottom:2px solid var(--line);padding:8px 10px;background:#fafbfe}
table.t td{border-bottom:1px solid var(--line);padding:9px 10px;vertical-align:top}
table.t tr:hover td{background:#fafbff}
.tablewrap{overflow-x:auto}

.notice{border-radius:8px;padding:12px 14px;font-size:14px;background:var(--soft);border-left:4px solid var(--royal)}
.notice.warn{background:var(--warnbg);border-color:var(--warn)}.notice.bad{background:var(--badbg);border-color:var(--bad)}.notice.ok{background:var(--okbg);border-color:var(--ok)}

/* auth */
.auth{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.auth .side{background:var(--navy);color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.auth .side::after{content:"";position:absolute;inset:auto -80px -80px auto;width:340px;height:340px;border:2px solid rgba(201,162,39,.35);transform:rotate(45deg)}
.auth .side::before{content:"";position:absolute;inset:auto auto -140px -60px;width:260px;height:260px;border:2px solid rgba(255,255,255,.08);transform:rotate(45deg)}
.auth .side h1{color:#fff;font-size:2.1rem;max-width:420px}
.auth .side p{color:#c8d3f0;max-width:430px}
.auth .tag{color:var(--gold);font-weight:600;letter-spacing:.4px}
.auth .formside{display:grid;place-items:center;padding:30px}
.auth .box{width:100%;max-width:400px}
.auth ul{padding-left:18px;color:#dfe6fb}
@media(max-width:860px){.auth{grid-template-columns:1fr}.auth .side{padding:30px;min-height:auto}}

/* modal & toast */
.overlay{position:fixed;inset:0;background:rgba(9,18,40,.55);display:grid;place-items:center;z-index:200;padding:16px}
.modal{background:#fff;border-radius:12px;max-width:560px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal.wide{max-width:1100px}
.modal header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;background:#fff;z-index:2}
.modal .body{padding:18px 20px}
.modal footer{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
.x{background:none;border:0;font-size:22px;cursor:pointer;color:var(--muted)}
#toasts{position:fixed;right:16px;bottom:16px;z-index:300;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--navy);color:#fff;padding:11px 15px;border-radius:9px;box-shadow:var(--shadow);font-size:14px;max-width:360px;border-left:4px solid var(--gold)}
.toast.bad{border-color:#ff6b6b}.toast.ok{border-color:#3ddc84}

/* checks */
.checks{display:grid;gap:10px}
.chk{display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:#fff}
.chk .ic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--muted);font-weight:700;flex:none}
.chk.ok .ic{background:var(--okbg);color:var(--ok)}.chk.bad .ic{background:var(--badbg);color:var(--bad)}.chk.run .ic{background:#e4ebfd;color:var(--royal)}
.chk .t1{font-weight:600}.chk .t2{font-size:13px;color:var(--muted)}
.previews{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.previews video{width:100%;background:#0b1430;border-radius:8px;aspect-ratio:16/10;object-fit:cover}
.qr{background:#fff;padding:10px;border-radius:8px;display:inline-block;border:1px solid var(--line)}
.code-big{font:700 26px var(--mono);letter-spacing:4px;color:var(--navy)}

/* exam room */
body.examroom{background:#eef1f8;overflow:hidden}
.xbar{height:62px;background:var(--navy);color:#fff;display:flex;align-items:center;gap:16px;padding:0 16px;border-bottom:3px solid var(--gold)}
.xbar .title{font-weight:600;line-height:1.2}
.xbar .title small{color:#c8d3f0;display:block;font-weight:400}
.timer{font:700 24px var(--mono);background:rgba(255,255,255,.08);border-radius:8px;padding:6px 14px;min-width:150px;text-align:center}
.timer.low{background:#b26a00}.timer.grace{background:var(--bad);animation:pulse 1.2s infinite}
.timer small{display:block;font:500 10px 'IBM Plex Sans';letter-spacing:.6px;text-transform:uppercase;opacity:.85}
@keyframes pulse{50%{opacity:.75}}
.status{display:flex;gap:6px;flex-wrap:wrap}
.status .pill{background:rgba(255,255,255,.1);color:#fff}
.xmain{display:grid;grid-template-columns:250px 1fr 300px;height:calc(100vh - 62px)}
.qnav{background:#fff;border-right:1px solid var(--line);overflow:auto;padding:12px}
.qnav h4{margin:14px 6px 6px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.qnav .qs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.qbtn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 4px;font:600 12.5px var(--mono);cursor:pointer;color:var(--navy);position:relative}
.qbtn.done{background:#e5f5ec;border-color:#9fd8b6}
.qbtn.on{outline:2px solid var(--royal);outline-offset:1px}
.qbtn.flag::after{content:"";position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--gold)}
.qpane{overflow:auto;padding:22px 28px 80px}
.qhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px}
.qid{font:700 13px var(--mono);color:var(--royal);background:#e4ebfd;border-radius:6px;padding:3px 8px}
.ctx{background:#fff;border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:8px;padding:12px 14px;margin-bottom:14px;font-size:14px;white-space:pre-line}
.ctx summary{cursor:pointer;font-weight:600;color:var(--navy)}
.qtext{font-size:16px;white-space:pre-line;margin-bottom:16px}
.opts{display:grid;gap:8px;margin-bottom:12px}
.opt{display:flex;gap:12px;align-items:center;border:1px solid var(--line);background:#fff;border-radius:9px;padding:11px 14px;cursor:pointer;font-size:15px}
.opt:hover{border-color:var(--royal)}
.opt.sel{border-color:var(--royal);background:#eef3ff;box-shadow:0 0 0 2px rgba(31,79,209,.15)}
.opt .k{font:700 13px var(--mono);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--navy);flex:none}
.opt.sel .k{background:var(--royal);color:#fff}
.side{background:#fff;border-left:1px solid var(--line);overflow:auto;padding:12px;display:flex;flex-direction:column;gap:12px}
.side video{width:100%;border-radius:8px;background:#0b1430;aspect-ratio:4/3;object-fit:cover}
.side h4{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.files li{font-size:13px;margin-bottom:4px;font-family:var(--mono)}
.files{padding-left:16px;margin:0}
.lock{position:fixed;inset:0;background:rgba(9,18,40,.92);color:#fff;z-index:500;display:grid;place-items:center;text-align:center;padding:20px}
.lock .box{max-width:520px}
.lock h2{color:#fff}
.lock p{color:#dfe6fb}

/* notebook cells */
.cells{display:grid;gap:12px;margin:10px 0 14px}
.cell{border:1px solid #c9d1e3;border-radius:9px;background:#fff;overflow:hidden}
.cell .bar{display:flex;align-items:center;gap:8px;background:#f5f7fc;border-bottom:1px solid var(--line);padding:6px 8px;font-size:12px}
.cell .bar select{width:auto;padding:3px 6px;font-size:12px}
.cell textarea.code{border:0;border-radius:0;min-height:120px;font-size:13.5px;line-height:1.55;background:#fbfcff;tab-size:4;white-space:pre;overflow:auto}
.cell textarea.code:focus{box-shadow:none}
.out{border-top:1px solid var(--line);background:#0d1630;color:#dce6ff;font:12.5px/1.5 var(--mono);padding:10px 12px;white-space:pre;overflow:auto;max-height:420px}
.out .err{color:#ff9d9d}
.out img{display:block;max-width:100%;background:#fff;border-radius:6px;margin:8px 0}
.out.empty{display:none}
.kernel{font-size:12px}

/* invigilator wall */
.wall{display:grid;grid-template-columns:1fr 330px;gap:16px;align-items:start}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.tile{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;position:relative}
.tile.alert{border-color:var(--bad);box-shadow:0 0 0 2px rgba(229,57,53,.35)}
.tile .media{position:relative;background:#0b1430;aspect-ratio:16/10}
.tile .media video{width:100%;height:100%;object-fit:contain;display:block}
.tile .media .cam{position:absolute;right:6px;bottom:6px;width:32%;aspect-ratio:4/3;object-fit:cover;border:2px solid #fff;border-radius:6px;background:#000}
.tile .media .ph{position:absolute;left:6px;bottom:6px;width:22%;aspect-ratio:3/4;object-fit:cover;border:2px solid var(--gold);border-radius:6px;background:#000}
.tile .media .placeholder{position:absolute;inset:0;display:grid;place-items:center;color:#8fa0c8;font-size:13px;text-align:center;padding:10px}
.tile .info{padding:10px 12px}
.tile .info .nm{font-weight:600;color:var(--navy)}
.tile .flags{position:absolute;top:8px;right:8px;background:var(--bad);color:#fff;font-weight:700;font-size:12px;border-radius:20px;padding:2px 8px}
.feed{max-height:calc(100vh - 170px);overflow:auto}
.ev{border-bottom:1px solid var(--line);padding:8px 2px;font-size:13px}
.ev .when{color:var(--muted);font-size:11.5px;font-family:var(--mono)}
.ev.high{border-left:3px solid var(--bad);padding-left:8px}.ev.warn{border-left:3px solid var(--warn);padding-left:8px}
.bigview{display:grid;grid-template-columns:2fr 1fr;gap:12px}
.bigview video{width:100%;background:#0b1430;border-radius:8px}
.thumbs{display:flex;flex-wrap:wrap;gap:6px}
.thumbs img{width:120px;border-radius:6px;border:1px solid var(--line);cursor:zoom-in}

/* marking */
.mq{border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:14px;overflow:hidden}
.mq .mh{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#f7f9fd;border-bottom:1px solid var(--line)}
.mq .mb{display:grid;grid-template-columns:1fr 1fr;gap:0}
.mq .mb>div{padding:12px 14px}
.mq .mb>div+div{border-left:1px solid var(--line);background:#fffdf4}
.ans{white-space:pre-wrap;font-size:14px}
.ans pre{background:#f4f6fb;border-radius:6px;padding:8px;font-size:12.5px;overflow:auto;white-space:pre}
.ans img{max-width:100%;border:1px solid var(--line);border-radius:6px;margin:6px 0}
.memo{white-space:pre-wrap;font-size:13.5px}
.markin{width:80px;text-align:center;font-weight:700}
.quick{display:flex;gap:4px;flex-wrap:wrap}
.bars .b{display:grid;grid-template-columns:70px 1fr 50px;gap:8px;align-items:center;font-size:13px;margin-bottom:5px}
.bars .track{background:var(--soft);border-radius:4px;height:12px;overflow:hidden}
.bars .fill{height:100%;background:var(--royal)}
.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px}
.stat .v{font-size:26px;font-weight:700;color:var(--navy)}
.stat .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}

/* phone */
body.phone{background:var(--navy);color:#fff}
.phonewrap{max-width:460px;margin:0 auto;padding:18px}
.phonewrap video{width:100%;border-radius:12px;background:#000;aspect-ratio:3/4;object-fit:cover}
.phonewrap .card{color:var(--ink)}
.bigstatus{font-size:20px;font-weight:700;text-align:center;padding:12px;border-radius:10px;background:rgba(255,255,255,.1)}
.bigstatus.ok{background:#17834a}.bigstatus.bad{background:#c62828}

@media(max-width:1100px){.xmain{grid-template-columns:200px 1fr}.xmain .side{display:none}.wall{grid-template-columns:1fr}}
@media print{.topbar,.noprint{display:none!important}}

<div id="app"><div style="display:grid;place-items:center;height:100vh;color:#5d6b86;font-family:sans-serif">Loading Camblish Online Exam…</div></div>
<div id="toasts"></div>
<script type="text/plain" id="worker-src">// Camblish Online Exam: Python/SQL runtime (runs in a Web Worker so proctoring keeps running)
// Author: Eddie Bila
const PYODIDE_URL = 'https://cdn.jsdelivr.net/pyodide/v0.27.2/full/';
let py = null;
let ready = null;

const HELPER = `
import sys, io, ast, base64, traceback, contextlib, os, sqlite3, json
os.makedirs('/data', exist_ok=True)
os.chdir('/data')
import matplotlib
matplotlib.use('Agg')
import matplotlib.pyplot as plt
import pandas as pd
pd.set_option('display.width', 160)
pd.set_option('display.max_columns', 30)
pd.set_option('display.max_rows', 60)
G = {'__name__': '__main__'}

def _figs():
    out = []
    for n in plt.get_fignums():
        f = plt.figure(n)
        b = io.BytesIO()
        f.savefig(b, format='png', dpi=80, bbox_inches='tight')
        out.append(base64.b64encode(b.getvalue()).decode())
    plt.close('all')
    return out

def _show(v):
    try:
        if isinstance(v, (pd.DataFrame, pd.Series)):
            return v.to_string(max_rows=60, max_cols=30)
    except Exception:
        pass
    return repr(v)

def run_py(src):
    buf = io.StringIO()
    err = None
    with contextlib.redirect_stdout(buf), contextlib.redirect_stderr(buf):
        try:
            tree = ast.parse(src, '<cell>', 'exec')
            last = None
            if tree.body and isinstance(tree.body[-1], ast.Expr):
                last = tree.body.pop()
            exec(compile(tree, '<cell>', 'exec'), G)
            if last is not None:
                v = eval(compile(ast.Expression(last.value), '<cell>', 'eval'), G)
                if v is not None:
                    print(_show(v))
        except Exception:
            err = traceback.format_exc(limit=4)
    out = buf.getvalue()
    if len(out) > 20000:
        out = out[:20000] + '\\n... (output truncated)'
    return json.dumps({'out': out, 'err': err, 'imgs': _figs()})

def _split_sql(sql):
    stmts, cur = [], ''
    for line in sql.splitlines(True):
        cur += line
        if sqlite3.complete_statement(cur):
            if cur.strip(): stmts.append(cur.strip())
            cur = ''
    if cur.strip(): stmts.append(cur.strip())
    return stmts

def run_sql(dbfile, sql):
    out, err = '', None
    try:
        con = sqlite3.connect(dbfile)
        cur = con.cursor()
        last = None
        for st in _split_sql(sql):
            cur.execute(st)
            if cur.description:
                cols = [d[0] for d in cur.description]
                rows = cur.fetchmany(501)
                last = (cols, rows)
            else:
                last = None
                out += f'Statement executed. Rows affected: {cur.rowcount}\\n'
        con.commit()
        if last:
            cols, rows = last
            df = pd.DataFrame(rows[:500], columns=cols)
            out += df.to_string(index=False, max_rows=500) if len(df) else '(no rows)'
            out += f'\\n\\n{len(rows[:500])} row(s)' + (' (showing first 500)' if len(rows) > 500 else '')
        con.close()
    except Exception as e:
        err = f'{type(e).__name__}: {e}'
    return json.dumps({'out': out, 'err': err, 'imgs': []})

def list_files():
    res = []
    for root, dirs, files in os.walk('/data'):
        for f in files:
            p = os.path.join(root, f)
            res.append({'path': p.replace('/data/', ''), 'size': os.path.getsize(p)})
    return json.dumps(res)
`;

async function init() {
  importScripts(PYODIDE_URL + 'pyodide.js');
  py = await loadPyodide({ indexURL: PYODIDE_URL });
  postMessage({ type: 'status', text: 'Loading pandas, numpy, matplotlib, scikit-learn…' });
  await py.loadPackage(['numpy', 'pandas', 'matplotlib', 'scikit-learn', 'sqlite3']);
  try { await py.loadPackage(['seaborn']); } catch (e) {
    try { await py.loadPackage('micropip'); await py.runPythonAsync("import micropip\nawait micropip.install('seaborn')"); } catch (e2) { /* optional */ }
  }
  py.runPython(HELPER);
  return true;
}

onmessage = async (e) => {
  const m = e.data;
  try {
    if (m.type === 'init') {
      if (!ready) ready = init();
      await ready;
      postMessage({ type: 'ready', id: m.id });
      return;
    }
    await ready;
    if (m.type === 'file') {
      const parts = m.name.split('/');
      if (parts.length > 1) py.FS.mkdirTree('/data/' + parts.slice(0, -1).join('/'));
      py.FS.writeFile('/data/' + m.name, new Uint8Array(m.buf));
      // Zipped datasets are unpacked next to the zip (the zip itself is kept)
      if (/\.zip$/i.test(m.name)) {
        try {
          py.globals.set('_zp', '/data/' + m.name);
          py.runPython("import zipfile, os\nwith zipfile.ZipFile(_zp) as z:\n    z.extractall(os.path.dirname(_zp) or '/data')");
        } catch (ze) { /* leave zip as is */ }
      }
      postMessage({ type: 'done', id: m.id, result: { ok: true } });
    } else if (m.type === 'run') {
      // Load any extra Pyodide packages the cell imports (scipy, statsmodels, ...)
      if (m.lang !== 'sql') { try { await py.loadPackagesFromImports(m.code); } catch (le) { /* the import error will show in the output */ } }
      const fnName = m.lang === 'sql' ? 'run_sql' : 'run_py';
      const f = py.globals.get(fnName);
      const res = m.lang === 'sql' ? f(m.db || '', m.code) : f(m.code);
      f.destroy && f.destroy();
      postMessage({ type: 'done', id: m.id, result: JSON.parse(res) });
    } else if (m.type === 'ls') {
      const f = py.globals.get('list_files');
      const res = f();
      f.destroy && f.destroy();
      postMessage({ type: 'done', id: m.id, result: JSON.parse(res) });
    }
  } catch (err) {
    postMessage({ type: 'done', id: m.id, result: { out: '', err: String(err && err.message || err), imgs: [] } });
  }
};

<script>
// Camblish Online Exam: question paper and memo parser
// Author: Eddie Bila
// Turns the plain-text lines of a Word or PDF question paper / memorandum into structured questions.
// Works in the browser and in Node (for testing).

(function (root) {
  const ID_RE = /^([A-H]\d{1,2}(?:\.\d{1,2}){0,3})(?:[\s:.)\-–]+)(.*)$/;
  const BARE_ID_RE = /^([A-H]\d{1,2}(?:\.\d{1,2}){0,3})\s*$/;
  const OPT_RE = /^\(?([a-hA-H])[\).]\s+(.+)$/;
  const MARKS_RE = /\((\d{1,3}(?:\.\d)?)\)\s*$/;
  const MARKS_ANY_RE = /\((\d{1,3}(?:\.\d)?)\)\s*$/m;
  const BRACKET_HDR_RE = /\[(\d{1,3})\]\s*$/;
  const SECTION_RE = /^SECTION\s+([A-H])\b\s*[:\-–]?\s*(.*)$/i;
  const GROUP_RE = /^(Question\s+[A-H]\d{1,2}\b.*)$/i;
  const STOP_RE = /^(—|-|–)?\s*END OF (ASSESSMENT|PAPER|EXAMINATION)|^TOTAL\s*:\s*\d+\s*MARKS/i;
  const CODE_HINT = /\b(write (a |an |the )?(python|sql|query|function|script|code)|sql|python|query|queries|code|function|script|implement|pivot table|create (one |two |a |an )?(visuali[sz]ation|chart|plot|graph)|create two|load the|run two|plot|regression model|visualis|visualiz)\b/i;

  function clean(s) {
    return String(s || '')
      .replace(/ /g, ' ')
      .replace(/[‘’]/g, "'")
      .replace(/[“”]/g, '"')
      .replace(/\s+/g, ' ')
      .trim();
  }

  // Drop lines that repeat on many pages (running headers/footers) and page numbers.

      const m = l.match(ID_RE);

        field = 'model_answer';
        let rest = m[2] || '';

      const page = await doc.getPage(p);
      const tc = await page.getTextContent();
      const rows = [];
      tc.items.forEach(it => {
        if (!it.str || !it.str.trim()) return;
        const y = Math.round(it.transform[5]);
        const x = it.transform[4];
        let row = rows.find(r => Math.abs(r.y - y) <= 2);
        if (!row) { row = { y, items: [] }; rows.push(row); }
        row.items.push({ x, w: it.width || 0, s: it.str });

      rows.sort((a, b) => b.y - a.y);
      rows.forEach(r => {
        r.items.sort((a, b) => a.x - b.x);

// Camblish Online Exam: auto-marking engine
// Author: Eddie Bila
// Scores a learner answer against memo criteria. Every result is a suggestion the assessor confirms.
//
// memo answer may carry:  auto: { criteria: [ {label, marks, any:[..], all:[..], re:[..], num:[..], tol, where, min_words} ], pick: n }
//   any  - matched if ANY of these phrases appears (case-insensitive; '|' inside a phrase is not special)
//   all  - matched only if ALL of these phrases appear
//   re   - matched if ANY regular expression matches (case-insensitive)
//   num  - matched if ANY of these numbers appears (commas, spaces, R prefix and % ignored), within tol (default 0.6% or 0.01)
//   where - 'text' (written answer), 'code', 'output' (what their code printed), or 'all' (default)
//   min_words - written answer must have at least this many words

//   pick - for "any two of ..." questions: only the best `pick` matched criteria count.

  function parts(ans) {
    ans = ans || {};
    const cells = ans.cells || [];
    const code = cells.map(c => c.code || '').join('\n');
    const output = cells.map(c => (c.out || '') + '\n' + (c.err ? '' : '')).join('\n');
    const errors = cells.map(c => c.err || '').join('\n');
    const text = (ans.text || '') + (ans.choice ? '\n' + ans.choice : '');
    return { code, output, text, errors, all: [text, code, output].join('\n') };
  }
  const norm = s => String(s || '').toLowerCase().replace(/[‘’]/g, "'").replace(/[“”]/g, '"').replace(/\s+/g, ' ');
  function numbersIn(s) {
    // Each figure is read on its own: "1629   713.94" (a printed table row) or "[4, 9, 5]" stay separate numbers.
    // Thousands separators: a comma with no space ("12,179.00"), or a single space in SA style ("1 234 567.89");
    // for the space form the joined value is added as well as the separate parts, because a table row like
    // "380 679.54" is ambiguous.
    const out = [];
    const src = String(s || '').replace(/R(?=\s?\d)/g, '');
    let m;

      const a = Math.abs(v);

      if (t < 1 && a >= 1 && a <= 100 && Math.abs(a / 100 - t) <= eps) return true;  // 61.5 for 0.615

      const keys = Object.entries(freq).sort((a, b) => b[1] - a[1]).slice(0, 12).map(x => x[0]);

    let method = 'memo criteria';
    if (!spec) { spec = derive(memo, q); method = spec.keywordMode ? 'keywords from model answer' : 'figures from model answer'; }

})(typeof window !== 'undefined' ? window : globalThis);

function platformInfo() {
  const uaD = navigator.userAgentData;
  const ua = navigator.userAgent;
  let browser = 'Other', os = 'Other';
  if (uaD && uaD.brands) {
    const b = uaD.brands.map(x => x.brand);
    if (b.includes('Google Chrome')) browser = 'Chrome';
    else if (b.includes('Microsoft Edge')) browser = 'Edge';
    else if (b.some(x => /Opera|Brave|Vivaldi|Yandex/i.test(x))) browser = 'Other Chromium';
    else if (b.includes('Chromium')) browser = 'Chromium';
    os = uaD.platform === 'Windows' ? 'Windows' : uaD.platform === 'macOS' ? 'macOS' : (uaD.platform || 'Other');
  } else {
    if (/Edg\//.test(ua)) browser = 'Edge'; else if (/Chrome\//.test(ua) && !/OPR\//.test(ua)) browser = 'Chrome'; else if (/Firefox\//.test(ua)) browser = 'Firefox'; else if (/Safari\//.test(ua)) browser = 'Safari';
    os = /Windows/.test(ua) ? 'Windows' : /Mac OS X/.test(ua) ? 'macOS' : 'Other';
  }
  const mobile = (uaD && uaD.mobile) || /Android|iPhone|iPad/i.test(ua);
  if (navigator.brave) browser = 'Other Chromium';
  const ok = browser === 'Chrome' && (os === 'Windows' || os === 'macOS') && !mobile;
  return { browser, os, mobile, ok, ua, screen: { w: screen.width, h: screen.height, extended: !!screen.isExtended }, cores: navigator.hardwareConcurrency, tz: Intl.DateTimeFormat().resolvedOptions().timeZone };
}

// Camblish Online Exam: live video between learners (laptop + phone) and invigilators
// Uses Supabase Realtime broadcast for signalling and WebRTC peer-to-peer for media.
// Author: Eddie Bila
const rid = () => Math.random().toString(36).slice(2, 10);

// Learner side (laptop or phone): sends its streams to every invigilator who says hello.
class LiveSender {
  constructor({ examId, attemptId, role, name }) {
    Object.assign(this, { examId, attemptId, role, name });
    this.peerId = `L:${role}:${attemptId}:${rid()}`;
    this.pcs = new Map();
    this.streams = {}; // {cam: MediaStream, screen: MediaStream}
    this.handlers = {};
  }
  on(type, f) { this.handlers[type] = f; return this; }
  setStreams(streams) { this.streams = streams; this.pcs.forEach((pc, id) => { pc.close(); this.pcs.delete(id); }); this.announce(); }
  async start() {
    this.ch = sb.channel('exm-live-' + this.examId, { config: { broadcast: { self: false } } });
    this.ch.on('broadcast', { event: 'sig' }, ({ payload: p }) => this.onSig(p).catch(e => console.warn('live', e)));
    await new Promise(res => this.ch.subscribe(st => { if (st === 'SUBSCRIBED') res(); }));
    this.announce();
    this.timer = setInterval(() => this.announce(), 45000);
  }
  send(p) { if (this.ch) this.ch.send({ type: 'broadcast', event: 'sig', payload: { ...p, from: this.peerId } }); }
  announce() { this.send({ type: 'present', attemptId: this.attemptId, role: this.role, name: this.name }); }
  flag(ev) { this.send({ type: 'flag', attemptId: this.attemptId, role: this.role, name: this.name, ...ev, at: new Date().toISOString() }); }
  async onSig(p) {
    if (p.type === 'warn' && p.attemptId === this.attemptId) return this.handlers.warn && this.handlers.warn(p);
    if (p.type === 'flag' && p.attemptId === this.attemptId && p.role === 'phone' && this.role === 'laptop') return this.handlers.phoneflag && this.handlers.phoneflag(p);
    if (p.type === 'extend' && p.attemptId === this.attemptId) return this.handlers.extend && this.handlers.extend(p);
    if (p.type === 'end' && p.attemptId === this.attemptId) return this.handlers.end && this.handlers.end(p);
    if (p.to && p.to !== this.peerId) return;
    if (p.type === 'hello') return this.connect(p.from);
    const pc = this.pcs.get(p.from);
    if (!pc) return;
    if (p.type === 'answer') await pc.setRemoteDescription(p.sdp);
    else if (p.type === 'ice' && p.cand) { try { await pc.addIceCandidate(p.cand); } catch (e) { } }
    else if (p.type === 'bye') { pc.close(); this.pcs.delete(p.from); }
  }
  async connect(invId) {
    const old = this.pcs.get(invId);
    if (old) {
      const st = old.connectionState;
      if (st === 'connected' || st === 'connecting' || (st === 'new' && Date.now() - old._fresh < 15000)) return;
      old.close();
    }
    const pc = new RTCPeerConnection({ iceServers: CFG.STUN });
    pc._fresh = Date.now();
    this.pcs.set(invId, pc);
    const ids = {};
    for (const [kind, st] of Object.entries(this.streams)) {
      if (!st) continue;
      ids[kind] = st.id;
      st.getTracks().forEach(t => {
        if (t.readyState !== 'live') return;
        const s = pc.addTrack(t, st);
        s._kind = kind; s._isVideo = t.kind === 'video';
      });
    }
    pc.onicecandidate = e => e.candidate && this.send({ type: 'ice', to: invId, cand: e.candidate.toJSON() });
    pc.onconnectionstatechange = () => {
      if (['failed', 'closed'].includes(pc.connectionState)) { if (this.pcs.get(invId) === pc) this.pcs.delete(invId); }
      if (pc.connectionState === 'connected') this.capBitrates(pc);
    };
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    this.send({ type: 'offer', to: invId, attemptId: this.attemptId, role: this.role, name: this.name, streams: ids, sdp: pc.localDescription.toJSON ? pc.localDescription.toJSON() : pc.localDescription });
  }
  async capBitrates(pc) {
    for (const s of pc.getSenders()) {
      if (!s.track || s.track.kind !== 'video') continue;
      try {
        const p = s.getParameters(); p.encodings = p.encodings && p.encodings.length ? p.encodings : [{}];
        if (s._kind === 'screen') { p.encodings[0].maxBitrate = 350000; p.encodings[0].maxFramerate = 4; }
        else if (this.role === 'phone') { p.encodings[0].maxBitrate = 200000; p.encodings[0].maxFramerate = 10; }
        else { p.encodings[0].maxBitrate = 180000; p.encodings[0].maxFramerate = 12; }
        await s.setParameters(p);
      } catch (e) { }
    }
  }
  stop() {
    clearInterval(this.timer);
    this.pcs.forEach((pc, id) => { this.send({ type: 'bye', to: id }); pc.close(); });
    this.pcs.clear();
    if (this.ch) { sb.removeChannel(this.ch); this.ch = null; }
  }
}

// Invigilator side: receives streams from every learner device in the exam.
class LiveReceiver {
  constructor(examId) {
    this.examId = examId; this.peerId = `I:${rid()}`; this.pcs = new Map(); this.handlers = {};
  }
  on(type, f) { this.handlers[type] = f; return this; }
  async start() {
    this.ch = sb.channel('exm-live-' + this.examId, { config: { broadcast: { self: false } } });
    this.ch.on('broadcast', { event: 'sig' }, ({ payload: p }) => this.onSig(p).catch(e => console.warn('live', e)));
    await new Promise(res => this.ch.subscribe(st => { if (st === 'SUBSCRIBED') res(); }));
    this.hello();
    this.timer = setInterval(() => this.watchdog(), 20000);
  }
  send(p) { if (this.ch) this.ch.send({ type: 'broadcast', event: 'sig', payload: { ...p, from: this.peerId } }); }
  hello(to) { this.send({ type: 'hello', ...(to ? { to } : {}) }); }
  warn(attemptId, message) { this.send({ type: 'warn', attemptId, message }); }
  notify(type, attemptId, extra = {}) { this.send({ type, attemptId, ...extra }); }
  watchdog() {
    this.pcs.forEach((pc, id) => { if (['failed', 'disconnected', 'closed'].includes(pc.connectionState)) { pc.close(); this.pcs.delete(id); this.hello(id.split('|')[0]); } });
  }
  async onSig(p) {
    if (p.type === 'flag') return this.handlers.flag && this.handlers.flag(p);
    if (p.type === 'present') { if (this.handlers.present) this.handlers.present(p); return this.hello(p.from); }
    if (p.to !== this.peerId) return;
    if (p.type === 'offer') {
      const old = this.pcs.get(p.from); if (old) old.close();
      const pc = new RTCPeerConnection({ iceServers: CFG.STUN });
      this.pcs.set(p.from, pc);
      pc._meta = { attemptId: p.attemptId, role: p.role, name: p.name, streams: p.streams || {} };
      const got = {};
      pc.ontrack = e => {
        const st = e.streams[0]; if (!st) return;
        const kind = Object.entries(pc._meta.streams).find(([k, id]) => id === st.id);
        const k = kind ? kind[0] : (e.track.kind === 'audio' ? 'cam' : 'cam');
        got[k] = st;
        this.handlers.stream && this.handlers.stream({ attemptId: p.attemptId, role: p.role, kind: k, stream: st, peer: p.from });
      };
      pc.onicecandidate = e => e.candidate && this.send({ type: 'ice', to: p.from, cand: e.candidate.toJSON() });
      pc.onconnectionstatechange = () => this.handlers.state && this.handlers.state({ attemptId: p.attemptId, role: p.role, state: pc.connectionState });
      await pc.setRemoteDescription(p.sdp);
      const ans = await pc.createAnswer();
      await pc.setLocalDescription(ans);
      this.send({ type: 'answer', to: p.from, sdp: pc.localDescription.toJSON ? pc.localDescription.toJSON() : pc.localDescription });
    } else if (p.type === 'ice') {
      const pc = this.pcs.get(p.from); if (pc && p.cand) { try { await pc.addIceCandidate(p.cand); } catch (e) { } }
    } else if (p.type === 'bye') {
      const pc = this.pcs.get(p.from); if (pc) { pc.close(); this.pcs.delete(p.from); }
      this.handlers.gone && this.handlers.gone({ peer: p.from });
    }
  }
  stop() { clearInterval(this.timer); this.pcs.forEach(pc => pc.close()); this.pcs.clear(); if (this.ch) { sb.removeChannel(this.ch); this.ch = null; } }
}

    </div>

  <div class="card"><h2>2. Question paper</h2>

  </div>
  <div class="card"><h2>5. Instructions to candidates</h2><p class="muted">One instruction per line. Shown before the learner starts.</p>
    <textarea id="instr" style="min-height:200px">${esc((exam.instructions || []).join('\n'))}</textarea></div>
  <div class="card"><h2>6. Invigilation settings</h2>
    <div class="grid2">
      <div class="field"><label>Evidence snapshot every (seconds)</label><input id="snap" type="number" min="10" max="300" value="${exam.settings.snapshot_sec}"></div>
      <div class="field"><label>Question order</label>
        <label class="check"><input type="checkbox" id="shuf" ${exam.settings.shuffle !== false ? 'checked' : ''}> Give every learner a different question order and MCQ option order</label>
        <label class="check" style="margin-top:6px"><input type="checkbox" id="reshuf" ${exam.settings.reshuffle_on_flag !== false ? 'checked' : ''}> Reshuffle the questions each time a learner leaves the exam screen or their phone moves</label></div>
      <div class="field"><label>Phone camera</label><label class="check"><input type="checkbox" id="reqphone" ${exam.settings.require_phone ? 'checked' : ''}> Learners must pair their phone as a side camera</label></div>
    </div>
    <div class="field"><label>Only allow these learner emails (optional, one per line)</label><textarea id="allowed" placeholder="Leave empty to allow any registered learner">${esc((exam.settings.allowed_emails || []).join('\n'))}</textarea></div>
  </div>
  </div>`));
  bindShell();

  const renderQ = () => {
    const qs = exam.paper.questions;
    const tot = qs.reduce((s, q) => s + (+q.marks || 0), 0);
    const bySec = {}; qs.forEach(q => bySec[q.section || q.id[0]] = (bySec[q.section || q.id[0]] || 0) + (+q.marks || 0));
    $('#qprev').innerHTML = qs.length ? `
      <div class="row" style="margin-bottom:10px"><span class="pill blue">${qs.length} questions</span><span class="pill ${exam.total_marks && +exam.total_marks !== tot ? 'bad' : 'ok'}">${tot} marks</span>${Object.entries(bySec).map(([k, v]) => `<span class="pill">Section ${k}: ${v}</span>`).join('')}<span class="pill">${qs.filter(q => q.type === 'mcq').length} MCQ · ${qs.filter(q => q.type === 'code').length} coding · ${qs.filter(q => q.type === 'text').length} written</span><button class="btn xs ghost" id="addq">+ Add question</button></div>
      <div class="tablewrap"><table class="t"><thead><tr><th style="width:80px">No.</th><th>Question</th><th style="width:110px">Type</th><th style="width:80px">Marks</th><th style="width:70px"></th></tr></thead><tbody>
      ${qs.map((q, i) => `<tr><td><code>${esc(q.id)}</code></td><td><div style="max-height:4.6em;overflow:hidden">${esc(q.text)}</div>${q.options ? `<small>${q.options.map(o => esc(o.key + ') ' + o.text)).join(' · ')}</small>` : ''}</td>
        <td><select data-type="${i}">${['mcq', 'code', 'text'].map(t => `<option value="${t}" ${q.type === t ? 'selected' : ''}>${{ mcq: 'Multiple choice', code: 'Code + answer', text: 'Written' }[t]}</option>`).join('')}</select></td>
        <td><input data-marks="${i}" type="number" step="0.5" min="0" value="${q.marks}" style="width:70px"></td>
        <td><button class="btn xs ghost" data-edit="${i}">Edit</button></td></tr>`).join('')}
      </tbody></table></div>` : '<p class="muted">No questions yet. Upload a paper.</p>';
    $$('[data-type]').forEach(s => s.onchange = () => { qs[+s.dataset.type].type = s.value; });
    $$('[data-marks]').forEach(s => s.onchange = () => { qs[+s.dataset.marks].marks = +s.value; renderQ(); });
    $$('[data-edit]').forEach(b => b.onclick = () => editQuestion(qs, +b.dataset.edit, renderQ));
    const add = $('#addq'); if (add) add.onclick = () => { qs.push({ id: 'Q' + (qs.length + 1), section: 'A', group: '', context: '', text: '', marks: 1, type: 'text' }); editQuestion(qs, qs.length - 1, renderQ); };
    renderM();
  };
  const renderM = () => {
    const qs = exam.paper.questions, ans = exam.memo.answers;
    const map = Object.fromEntries(ans.map(a => [a.id, a]));
    const missing = qs.filter(q => !map[q.id]);
    const mcqNoKey = qs.filter(q => q.type === 'mcq' && !(map[q.id] && map[q.id].answer));
    $('#mprev').innerHTML = ans.length ? `<div class="row" style="margin-bottom:8px"><span class="pill ok">${ans.length} memo answers</span>${missing.length ? `<span class="pill warn">No memo for ${missing.map(q => q.id).join(', ')}</span>` : '<span class="pill ok">Every question has a memo</span>'}${mcqNoKey.length ? `<span class="pill bad">MCQ without answer key: ${mcqNoKey.map(q => q.id).join(', ')}</span>` : ''}</div>
      <div class="tablewrap"><table class="t"><thead><tr><th>No.</th><th>Key</th><th>Model answer</th><th>Tip</th><th></th></tr></thead><tbody>
      ${qs.map(q => { const a = map[q.id] || {}; return `<tr><td><code>${esc(q.id)}</code></td><td>${q.type === 'mcq' ? `<b>${esc(a.answer || '–')}</b>` : ''}</td><td><div style="max-height:3em;overflow:hidden;font-size:13px">${esc(a.model_answer || '')}</div></td><td><small>${esc((a.tip || '').slice(0, 90))}</small></td><td><button class="btn xs ghost" data-medit="${esc(q.id)}">Edit</button></td></tr>`; }).join('')}
      </tbody></table></div>` : '<p class="muted">No memo yet.</p>';
    $$('[data-medit]').forEach(b => b.onclick = () => editMemo(exam, b.dataset.medit, renderM));
  };
  const renderD = () => {
    $('#dlist').innerHTML = exam.datasets.length ? exam.datasets.map((d, i) => `<li>${esc(d.name)} <small class="muted">${fmtSize(d.size || 0)}</small> <a href="#" data-rm="${i}">remove</a></li>`).join('') : '<li class="muted" style="font-family:inherit">No data files yet.</li>';
    $$('[data-rm]').forEach(a => a.onclick = e => { e.preventDefault(); exam.datasets.splice(+a.dataset.rm, 1); renderD(); });
  };
  renderQ(); renderD();

  const collect = () => {
    const v = id => $('#' + id).value;
    const iso = x => x ? new Date(x).toISOString() : null;
    const o = {
      title: v('title').trim(), qualification: v('qual').trim(), saqa_id: v('saqa').trim(), status: v('status'),
      duration_min: +v('dur') || 180, grace_min: +v('grace') || 0, pass_mark: +v('pass') || 60,
      opens_at: iso(v('opens')), closes_at: iso(v('closes')),
      instructions: v('instr').split('\n').map(s => s.trim()).filter(Boolean),
      paper: exam.paper, memo: exam.memo, datasets: exam.datasets,
      settings: { ...exam.settings, snapshot_sec: +v('snap') || 30, require_phone: $('#reqphone').checked, shuffle: $('#shuf').checked, reshuffle_on_flag: $('#reshuf').checked, allowed_emails: v('allowed').split(/[\s,;]+/).map(s => s.trim().toLowerCase()).filter(Boolean) },
    };
    if (v('total')) o.total_marks = +v('total');
    if (exam.id) o.id = exam.id;
    return o;
  };
  const save = async (quiet) => {
    const o = collect();
    if (!o.title) throw new Error('Give the exam a title first');
    if (o.status === 'open') {
      if (!o.paper.questions.length) throw new Error('Upload a question paper before opening the exam');
      if (o.paper.questions.some(q => q.type === 'mcq') && !o.memo.answers.length) {
        if (!await confirmBox('No memo yet', 'MCQs cannot be auto-marked without a memo. You can add it later. Open anyway?', 'Open anyway')) throw new Error('Not saved');
      }
    }
    const r = await api('exm_exam_save', { p_exam: o });
    const wasNew = !exam.id;
    exam = Object.assign(exam, r.exam);
    if (!quiet) toast('Exam saved', 'ok');
    if (wasNew) history.replaceState(null, '', '#/exam/' + exam.id);
    return exam;
  };
  $('#save').onclick = e => busy(e.currentTarget, () => save()).catch(() => { });

  $('#paperFile').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    $('#paperMsg').textContent = 'Reading ' + f.name + '…';
    try {
      const parsed = await parsePaperFile(f);
      if (!parsed.questions.length) throw new Error('No numbered questions were found. Check that each question starts with its number (e.g. A1, B1.1).');
      const replace = !exam.paper.questions.length || await confirmBox('Replace questions?', `Found ${parsed.questions.length} questions (${parsed.parsed_total} marks). Replace the current ${exam.paper.questions.length} questions?`, 'Replace');
      if (!replace) return;
      exam.paper = { ...exam.paper, questions: parsed.questions, source_file: f.name };
      if (!$('#title').value && parsed.title) $('#title').value = parsed.title;
      if (parsed.saqa_id && !$('#saqa').value) $('#saqa').value = parsed.saqa_id;
      if (parsed.duration_min) $('#dur').value = parsed.duration_min;
      if (parsed.pass_mark) $('#pass').value = parsed.pass_mark;
      if (parsed.total_marks) $('#total').value = parsed.total_marks;
      if (parsed.qualification && !$('#qual').value) $('#qual').value = parsed.qualification;
      if (parsed.instructions && parsed.instructions.length) $('#instr').value = parsed.instructions.join('\n');
      if (parsed.grace_min != null) $('#grace').value = parsed.grace_min;
      if (parsed.settings) {
        const st = parsed.settings;
        if (st.snapshot_sec) $('#snap').value = st.snapshot_sec;
        if (st.shuffle != null) $('#shuf').checked = !!st.shuffle;
        if (st.reshuffle_on_flag != null) $('#reshuf').checked = !!st.reshuffle_on_flag;
        if (st.require_phone != null) $('#reqphone').checked = !!st.require_phone;
      }
      if (parsed.memo && parsed.memo.answers && parsed.memo.answers.length && !exam.memo.answers.length) { exam.memo = { answers: parsed.memo.answers, source_file: f.name }; renderM(); $('#memoMsg').innerHTML = `<span class="pill ok">${parsed.memo.answers.length} answers</span>`; }
      renderQ();
      $('#paperMsg').innerHTML = `<span class="pill ok">${parsed.questions.length} questions · ${parsed.parsed_total} marks</span>`;
      if (parsed.total_marks && parsed.total_marks !== parsed.parsed_total) toast(`The paper says ${parsed.total_marks} marks but the questions add up to ${parsed.parsed_total}. Check the marks.`, 'bad');
      // keep the original file with the exam
      await save(true);
      fileToB64(f).then(b => fn('upload', { exam_id: exam.id, kind: 'paper', filename: f.name, content_type: f.type || 'application/octet-stream', data_base64: b })).catch(() => { });
      toast('Question paper loaded and saved', 'ok');
    } catch (err) { $('#paperMsg').textContent = ''; toast(err.message, 'bad'); }
    e.target.value = '';
  };
  $('#memoFile').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    $('#memoMsg').textContent = 'Reading ' + f.name + '…';
    try {
      const memo = await parseMemoFile(f, exam.paper.questions.map(q => q.id));
      if (!memo.answers.length) throw new Error('No answers found. Each answer must start with its question number.');
      exam.memo = { answers: memo.answers, source_file: f.name };
      renderM();
      $('#memoMsg').innerHTML = `<span class="pill ok">${memo.answers.length} answers</span>`;
      await save(true);
      fileToB64(f).then(b => fn('upload', { exam_id: exam.id, kind: 'memo', filename: f.name, content_type: f.type || 'application/octet-stream', data_base64: b })).catch(() => { });
      toast('Memo loaded and saved', 'ok');
    } catch (err) { $('#memoMsg').textContent = ''; toast(err.message, 'bad'); }
    e.target.value = '';
  };
  $('#dataFiles').onchange = async e => {
    const files = Array.from(e.target.files); if (!files.length) return;
    try {
      if (!exam.id) await save(true);
      for (const f of files) {
        if (f.size > 20e6) { toast(f.name + ' is larger than 20 MB, skipped', 'bad'); continue; }

        const r = await fn('upload', { exam_id: exam.id, kind: 'dataset', filename: f.name, content_type: f.type || 'application/octet-stream', data_base64: await fileToB64(f) });
        exam.datasets = exam.datasets.filter(d => d.name !== f.name).concat([{ name: f.name, path: r.path, size: r.size || f.size }]);
        renderD();
      }
      await save(true);
      $('#dataMsg').textContent = '';
      toast('Data files uploaded', 'ok');
    } catch (err) { $('#dataMsg').textContent = ''; toast(err.message, 'bad'); }
    e.target.value = '';
  };

async function fileLines(f) {
  const buf = await f.arrayBuffer();
  if (/\.docx$/i.test(f.name)) { await loadScript(LIBS.mammoth); const r = await window.mammoth.extractRawText({ arrayBuffer: buf }); return r.value.split(/\n+/); }
  if (/\.pdf$/i.test(f.name)) { await loadScript(LIBS.pdf); window.pdfjsLib.GlobalWorkerOptions.workerSrc = LIBS.pdfWorker; return ExamParser.linesFromPdf(buf, window.pdfjsLib); }
  throw new Error('Use a .docx, .pdf or .json file');
}
async function parsePaperFile(f) {
  if (/\.json$/i.test(f.name)) { const j = JSON.parse(await f.text()); const qs = j.questions || (j.paper && j.paper.questions) || []; return { ...j, questions: qs, parsed_total: qs.reduce((s, q) => s + (+q.marks || 0), 0) }; }
  return ExamParser.parsePaper(await fileLines(f));
}
async function parseMemoFile(f, ids) {
  if (/\.json$/i.test(f.name)) { const j = JSON.parse(await f.text()); return { answers: j.answers || (j.memo && j.memo.answers) || [] }; }
  return ExamParser.parseMemo(await fileLines(f), ids);
}

// ---------- Python runtime client ----------
const PyRT = {
  worker: null, seq: 0, pending: new Map(), readyP: null, status: 'idle', files: [],
  start(onStatus) {
    if (this.readyP) return this.readyP;
    const src = document.getElementById('worker-src').textContent;
    this.worker = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
    this.worker.onmessage = e => {
      const m = e.data;
      if (m.type === 'status') { onStatus && onStatus(m.text); return; }
      const p = this.pending.get(m.id);
      if (p) { this.pending.delete(m.id); p(m.result); }
    };
    this.status = 'loading';
    this.readyP = this.call({ type: 'init' }).then(() => { this.status = 'ready'; return true; });
    return this.readyP;
  },
  call(msg, transfer) { return new Promise(res => { const id = ++this.seq; this.pending.set(id, res); this.worker.postMessage({ ...msg, id }, transfer || []); }); },
  async addFile(name, buf) { await this.readyP; return this.call({ type: 'file', name, buf }, [buf]); },
  async run(lang, code, db) {
    await this.readyP;
    let timer;
    const t = new Promise(res => { timer = setTimeout(() => res({ timeout: true }), 120000); });
    const r = await Promise.race([this.call({ type: 'run', lang, code, db }), t]);
    clearTimeout(timer);
    return r;
  },
  async ls() { await this.readyP; return this.call({ type: 'ls' }); },
  async restart(onStatus) {
    if (this.worker) this.worker.terminate();
    this.pending.forEach(p => p({ out: '', err: 'Python was restarted', imgs: [] })); this.pending.clear();
    this.readyP = null; this.worker = null;
    await this.start(onStatus);
    for (const f of this.files) await this.addFile(f.name, f.buf.slice(0));
  },
};

// ---------- media helpers ----------
async function getCamMic() {
  return navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 15 } }, audio: { echoCancellation: true, noiseSuppression: false } });
}
async function getScreen() {
  const st = await navigator.mediaDevices.getDisplayMedia({
    video: { displaySurface: 'monitor', frameRate: { ideal: 5, max: 10 } }, audio: false,
    monitorTypeSurfaces: 'include', selfBrowserSurface: 'include', surfaceSwitching: 'exclude', preferCurrentTab: false,
  });
  const tr = st.getVideoTracks()[0];
  const surf = tr.getSettings().displaySurface;
  if (surf && surf !== 'monitor') { st.getTracks().forEach(t => t.stop()); throw new Error('You shared a ' + (surf === 'browser' ? 'browser tab' : 'window') + '. You must share your ENTIRE SCREEN.'); }
  return st;
}
function frameJpeg(video, maxW, q) {
  if (!video || !video.videoWidth) return null;
  const w = Math.min(maxW, video.videoWidth), h = Math.round(video.videoHeight * w / video.videoWidth);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  c.getContext('2d').drawImage(video, 0, 0, w, h);
  return new Promise(res => c.toBlob(b => res(b), 'image/jpeg', q));
}
function stopStream(st) { if (st) st.getTracks().forEach(t => t.stop()); }

function micMeter(stream, cb) {
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    const src = ac.createMediaStreamSource(stream); const an = ac.createAnalyser(); an.fftSize = 1024; src.connect(an);
    const d = new Float32Array(an.fftSize);
    let alive = true;
    const tick = () => { if (!alive) return; an.getFloatTimeDomainData(d); let s = 0; for (const v of d) s += v * v; cb(Math.sqrt(s / d.length)); requestAnimationFrame(tick); };
    tick();
    const stop = () => { alive = false; ac.close(); };
    S.cleanup.push(stop);
    return { an, ac, stop };
  } catch (e) { return null; }
}

const Q = () => XS.paper.questions;

// ---------- question order: per-learner shuffle and reshuffle on integrity events ----------
function seededRand(seed) { let h = 2166136261; for (const ch of String(seed)) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return () => { h += 0x6D2B79F5; let t = h; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function shuffleArr(a, rnd) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const shuffleOn = () => !XS.examMeta || !XS.examMeta.settings || XS.examMeta.settings.shuffle !== false;
const reshuffleOn = () => !XS.examMeta || !XS.examMeta.settings || XS.examMeta.settings.reshuffle_on_flag !== false;
function orderQuestions(seed) {
  // keep sections in their order (A, B, C ...) and shuffle the questions and MCQ options inside each section
  const rnd = seededRand(seed);
  const qs = XS.original || (XS.original = XS.paper.questions.map(q => ({ ...q, options: q.options ? q.options.slice() : undefined })));
  const secs = [], by = {};
  qs.forEach(q => { const s = q.section || q.id[0]; if (!by[s]) { by[s] = []; secs.push(s); } by[s].push(q); });
  XS.paper.questions = secs.flatMap(s => shuffleArr(by[s].map(q => ({ ...q, options: q.options ? shuffleArr(q.options.slice(), rnd) : undefined })), rnd));
}
function applyStoredOrder() {
  if (!shuffleOn()) return;
  const n = (store.get('shuf.' + XS.attempt.id) || 0);
  XS.shuffleCount = n;
  orderQuestions(XS.attempt.id + ':' + n);
}
function reshuffle(reason) {
  if (XS.ended || !reshuffleOn() || !XS.paper) return;
  if (XS.lastShuffle && Date.now() - XS.lastShuffle < 15000) return;
  XS.lastShuffle = Date.now();
  const curId = Q()[XS.cur] && Q()[XS.cur].id;
  XS.shuffleCount = (XS.shuffleCount || 0) + 1;
  if (!XS.preview) store.set('shuf.' + XS.attempt.id, XS.shuffleCount);
  orderQuestions(XS.attempt.id + ':' + XS.shuffleCount + ':' + Date.now());
  const firstOpen = Q().findIndex(q => !answered(q));
  XS.cur = firstOpen >= 0 ? firstOpen : Math.max(0, Q().findIndex(q => q.id === curId));
  drawNav(); drawQ();
  logEv('questions_reshuffled', 'info', { reason, count: XS.shuffleCount });
  const box = $('#shufNote');
  if (box) { box.innerHTML = `<b>Questions reshuffled</b> because ${esc(reason)}. Your answers are saved; use the question numbers on the left to find any question.`; box.classList.remove('hidden'); clearTimeout(XS.shufT); XS.shufT = setTimeout(() => box.classList.add('hidden'), 12000); }
}
function answered(q) {
  const a = XS.answers[q.id]; if (!a) return false;
  if (q.type === 'mcq') return !!a.choice;
  return !!((a.text && a.text.trim()) || (a.cells && a.cells.some(c => c.code && c.code.trim())));
}

function drawNav() {

function setAns(qid, patch) {
  XS.answers[qid] = { ...(XS.answers[qid] || {}), ...patch, t: Date.now() };
  XS.dirty.add(qid);
  if (!XS.preview) try { const lite = {}; Object.entries(XS.answers).forEach(([k, v]) => { lite[k] = { ...v, cells: v.cells ? v.cells.map(c => ({ ...c, imgs: [] })) : undefined }; }); store.set('ans.' + XS.attempt.id, lite); } catch (e) { }
  clearTimeout(XS.saveT); XS.saveT = setTimeout(() => saveNow(), 2500);
}

function drawQ() {
  const q = Q()[XS.cur]; if (!q) return;
  const a = XS.answers[q.id] || {};
  const prev = Q()[XS.cur - 1];
  const showCtx = q.context && (!prev || prev.context !== q.context || true);
  const pane = $('#qpane');
  pane.innerHTML = `
    <div class="qhead"><div class="row"><span class="qid">${esc(q.id)}</span><span class="muted">${esc(q.group || '')}</span></div><span class="pill gold">${q.marks} mark${q.marks == 1 ? '' : 's'}</span></div>
    ${showCtx ? `<details class="ctx" ${!prev || prev.context !== q.context ? 'open' : ''}><summary>Scenario and instructions</summary><div style="margin-top:8px">${esc(q.context)}</div></details>` : ''}
    <div class="qtext">${esc(q.text)}</div>
    <div id="ansArea"></div>
    <div class="row between" style="margin-top:20px">

    </div>`;
  $('#prevQ').onclick = () => { XS.cur--; drawQ(); drawNav(); };
  $('#nextQ').onclick = () => { if (XS.cur === Q().length - 1) return confirmSubmit(); XS.cur++; drawQ(); drawNav(); };
  $('#flagQ').onchange = e => { setAns(q.id, { flag: e.target.checked }); drawNav(); };
  const area = $('#ansArea');
  if (q.type === 'mcq') {
    area.innerHTML = `<div class="opts">${(q.options || []).map((o, oi) => `<div class="opt ${a.choice === o.key ? 'sel' : ''}" data-k="${esc(o.key)}"><span class="k">${'abcdefgh'[oi]}</span><span>${esc(o.text)}</span></div>`).join('')}</div>`;
    $$('.opt', area).forEach(o => o.onclick = () => { setAns(q.id, { choice: o.dataset.k }); drawQ(); drawNav(); });
    return;
  }
  if (q.type === 'code') {
    const cells = a.cells && a.cells.length ? a.cells : [{ lang: /\bsql\b|query/i.test(q.text) && !/python/i.test(q.text) ? 'sql' : 'python', code: '', out: '', err: '', imgs: [] }];
    area.innerHTML = `<label>Your code</label><div class="cells" id="cells"></div><button class="btn xs ghost" id="addCell">+ Add code cell</button>
      <div class="field" style="margin-top:16px"><label>Your written answer / explanation of the output</label><textarea id="txt" placeholder="Explain your result, answer any written part of the question here.">${esc(a.text || '')}</textarea></div>`;
    const drawCells = () => {
      $('#cells').innerHTML = '';
      cells.forEach((c, ci) => $('#cells').appendChild(cellEl(q, cells, ci, drawCells)));
    };
    drawCells();
    $('#addCell').onclick = () => { cells.push({ lang: 'python', code: '', out: '', err: '', imgs: [] }); setAns(q.id, { cells }); drawCells(); };
    $('#txt').oninput = e => setAns(q.id, { text: e.target.value, cells });
    return;
  }
  area.innerHTML = `<label>Your answer</label><textarea id="txt" style="min-height:260px" placeholder="Type your answer here.">${esc(a.text || '')}</textarea><div class="hint" id="wc"></div>`;
  const wc = () => { const n = ($('#txt').value.trim().match(/\S+/g) || []).length; $('#wc').textContent = n + ' words'; };
  $('#txt').oninput = e => { setAns(q.id, { text: e.target.value }); wc(); drawNavLater(); };
  wc();
}
let navT; function drawNavLater() { clearTimeout(navT); navT = setTimeout(drawNav, 800); }

function cellEl(q, cells, ci, redraw) {
  const c = cells[ci];
  const dbs = PyRT.files.filter(f => /\.(db|sqlite3?)$/i.test(f.name)).map(f => f.name).concat(XS.extraDbs || []);
  const uniq = [...new Set(dbs)];
  const e = el(`<div class="cell"><div class="bar">
    <select class="lang"><option value="python" ${c.lang === 'python' ? 'selected' : ''}>Python</option><option value="sql" ${c.lang === 'sql' ? 'selected' : ''}>SQL</option></select>
    <span class="dbw ${c.lang === 'sql' ? '' : 'hidden'}">on <select class="db">${uniq.map(d => `<option ${c.db === d ? 'selected' : ''}>${esc(d)}</option>`).join('')}<option value="__other">other file…</option></select></span>
    <span class="grow muted">Ctrl/Cmd + Enter to run</span>
    <button class="btn xs run">▶ Run</button>${cells.length > 1 ? '<button class="btn xs ghost del">Remove</button>' : ''}</div>
    <textarea class="code" spellcheck="false" placeholder="${c.lang === 'sql' ? 'SELECT ...' : '# Python code'}">${esc(c.code)}</textarea>
    <div class="out ${c.out || c.err || (c.imgs && c.imgs.length) ? '' : 'empty'}"></div></div>`);
  const ta = $('textarea', e), out = $('.out', e);

    out.innerHTML = (c.out ? esc(c.out) : '') + (c.err ? `<span class="err">${esc(c.err)}</span>` : '') + (c.imgs || []).map(b => `<img src="data:image/png;base64,${b}">`).join('');
    out.classList.toggle('empty', !(c.out || c.err || (c.imgs && c.imgs.length)));
  };
  paintOut();
  const autoH = () => { ta.style.height = 'auto'; ta.style.height = Math.max(120, Math.min(600, ta.scrollHeight + 4)) + 'px'; };
  setTimeout(autoH, 0);
  ta.oninput = () => { c.code = ta.value; setAns(q.id, { cells }); autoH(); drawNavLater(); };
  ta.onkeydown = ev => {
    if (ev.key === 'Tab') { ev.preventDefault(); const s = ta.selectionStart; ta.setRangeText('    ', s, ta.selectionEnd, 'end'); ta.oninput(); }
    if (ev.key === 'Enter' && (ev.ctrlKey || ev.metaKey || ev.shiftKey)) { ev.preventDefault(); runIt(); }
  };
  $('.lang', e).onchange = ev => { c.lang = ev.target.value; if (c.lang === 'sql' && !c.db) c.db = uniq[0] || ''; setAns(q.id, { cells }); redraw(); };
  const dbSel = $('.db', e);
  if (dbSel) { if (!c.db && uniq[0]) c.db = uniq[0]; dbSel.onchange = async ev => { if (ev.target.value === '__other') { const n = await promptBox('SQLite database file', 'File name in your workspace (e.g. electronics.db created by your Python code)', ''); if (n) { XS.extraDbs = [...(XS.extraDbs || []), n]; c.db = n; } setAns(q.id, { cells }); redraw(); } else { c.db = ev.target.value; setAns(q.id, { cells }); } }; }
  const del = $('.del', e); if (del) del.onclick = async () => { if (await confirmBox('Remove cell', 'Remove this code cell and its output?', 'Remove', 'danger')) { cells.splice(ci, 1); setAns(q.id, { cells }); redraw(); } };
  const runIt = async () => {
    const btn = $('.run', e); btn.disabled = true; btn.textContent = 'Running…';
    out.classList.remove('empty'); out.innerHTML = '<span style="color:#8fa0c8">Running…</span>';
    if (PyRT.status !== 'ready') out.innerHTML = '<span style="color:#8fa0c8">Waiting for Python to finish loading…</span>';
    const r = await PyRT.run(c.lang, c.code, c.db);
    if (r.timeout) { c.out = ''; c.err = 'This cell ran for more than 2 minutes and was stopped. Python will restart; run your earlier cells again.'; c.imgs = []; PyRT.restart(); }
    else { c.out = r.out || ''; c.err = r.err || ''; c.imgs = (r.imgs || []).slice(0, 4); if (!c.out && !c.err && !c.imgs.length) c.out = '(ran with no output)'; }
    setAns(q.id, { cells }); paintOut(); btn.disabled = false; btn.textContent = '▶ Run';
  };
  $('.run', e).onclick = runIt;
  return e;
}

async function loadDatasets() {
  const ds = XS.datasets || [];
  if (!ds.length) { $('#dfiles').innerHTML = '<li class="muted">No data files for this exam</li>'; return; }
  try {
    const { urls } = await fn('sign', { paths: ds.map(d => d.path), expires: 3600 * 5 });
    $('#dfiles').innerHTML = ds.map(d => `<li data-n="${esc(d.name)}">${esc(d.name)} <small class="muted">loading…</small></li>`).join('');
    for (const d of ds) {
      const li = $(`#dfiles [data-n="${CSS.escape(d.name)}"] small`);
      try {
        const res = await fetch(urls[d.path]); if (!res.ok) throw new Error(res.status);
        const buf = await res.arrayBuffer();
        PyRT.files = PyRT.files.filter(f => f.name !== d.name).concat([{ name: d.name, buf: buf.slice(0) }]);
        await PyRT.addFile(d.name, buf);
        if (li) li.textContent = fmtSize(d.size || buf.byteLength) + ' ✓';
      } catch (e) { if (li) li.innerHTML = '<span style="color:var(--bad)">failed</span>'; }
    }
    if (Q()[XS.cur] && Q()[XS.cur].type === 'code') drawQ();
  } catch (e) { $('#dfiles').innerHTML = `<li style="color:var(--bad)">Could not load data files: ${esc(e.message)}</li>`; }
}

// ---------- timer, saving ----------
function now() { return Date.now() + XS.offset; }
function tickTimer() {
  if (XS.ended) return;
  if (XS.preview) { const tm = $('#timer'); if (tm) tm.innerHTML = `<small>Duration</small><span>${XS.examMeta.duration_min} min</span>`; return; }
  const t = now(), tm = $('#timer'); if (!tm) return;
  if (t < XS.deadline) {
    const left = XS.deadline - t;
    tm.className = 'timer' + (left < 10 * 60000 ? ' low' : '');
    tm.innerHTML = `<small>Time left</small><span>${fmtDur(left)}</span>`;
    [30, 10, 5, 1].forEach(m => { if (left < m * 60000 && !XS['w' + m]) { XS['w' + m] = true; if (left > (m - 1) * 60000) toast(`${m} minute${m > 1 ? 's' : ''} left`, m <= 5 ? 'bad' : ''); } });
  } else if (t < XS.hard) {
    tm.className = 'timer grace';
    tm.innerHTML = `<small>Grace period · submit now</small><span>${fmtDur(XS.hard - t)}</span>`;
    if (!XS.graceShown) { XS.graceShown = true; modal({ title: 'Time is up: grace period', body: `<p>The ${XS.examMeta.duration_min} minutes are over. You have <b>${Math.round((XS.hard - XS.deadline) / 60000)} minutes</b> grace to finish and submit. The exam will then submit itself automatically.</p>`, actions: [{ label: 'OK' }] }); logEv('grace_started', 'info'); }
  } else {
    if (!XS.autoSubmitting) { XS.autoSubmitting = true; doSubmit(true); }
  }
}
async function saveNow() {
  if (XS.preview) { XS.dirty.clear(); return; }
  if (XS.ended || XS.saving) return;
  XS.saving = true;
  const keys = [...XS.dirty]; XS.dirty.clear();
  const patch = {}; keys.forEach(k => patch[k] = XS.answers[k]);
  try {
    const r = await api('exm_attempt_save', { p_attempt_id: XS.attempt.id, p_answers: patch });
    XS.offset = new Date(r.server_now).getTime() - Date.now();
    XS.deadline = new Date(r.deadline_at).getTime(); XS.hard = new Date(r.hard_deadline_at).getTime();
    XS.phonePaired = !!r.phone_paired_at; XS.phoneLastSeen = r.phone_last_seen; drawPhone();

// ---------- proctoring ----------
function logEv(kind, severity = 'info', detail = {}) {
  if (!XS.attempt || XS.preview) return;
  XS.events.push({ kind, severity, detail, at: new Date(now()).toISOString() });
  if (severity !== 'info' && XS.live) XS.live.flag({ kind, severity, detail });
  if (XS.events.length > 40) flushEvents();
}
async function flushEvents() {
  if (!XS.events.length || !XS.attempt) return;
  const batch = XS.events.splice(0, 150);
  try { await api('exm_event_log', { p_attempt_id: XS.attempt.id, p_events: batch }); } catch (e) { XS.events.unshift(...batch); }
}
async function uploadEvidence(kind, blob, event) {
  if (!blob || !XS.attempt) return;
  try {
    const r = await fn('upload', { attempt_id: XS.attempt.id, kind, content_type: blob.type || 'image/jpeg', data_base64: await blobToB64(blob), ...(event ? { event } : {}) });
    if (event && XS.live) XS.live.flag({ kind: event.kind, severity: event.severity, detail: event.detail, evidence_path: r.path });
    return r.path;
  } catch (e) { if (event) logEv(event.kind, event.severity, { ...(event.detail || {}), evidence_failed: true }); }
}
const throttle = {};
function once(key, ms) { const t = Date.now(); if (throttle[key] && t - throttle[key] < ms) return false; throttle[key] = t; return true; }
async function flagWithEvidence(kind, severity, detail, { screen = false, clip = false } = {}) {
  const v = screen ? XS.scrVideo : $('#selfCam');
  const b = await frameJpeg(v, screen ? 1280 : 480, 0.6);
  if (b) uploadEvidence(screen ? 'snapshot_screen' : 'snapshot_cam', b, { kind, severity, detail });
  else logEv(kind, severity, detail);
  if (clip) recordClip(kind);
}
function recordClip(kind) {
  if (XS.clips >= 25 || XS.recording || !XS.cam || typeof MediaRecorder === 'undefined') return;
  XS.recording = true; XS.clips++;
  try {
    const mime = ['video/webm;codecs=vp8,opus', 'video/webm'].find(m => MediaRecorder.isTypeSupported(m));
    const rec = new MediaRecorder(XS.cam, { mimeType: mime, videoBitsPerSecond: 250000, audioBitsPerSecond: 32000 });
    const chunks = [];
    rec.ondataavailable = e => e.data.size && chunks.push(e.data);
    rec.onstop = () => { XS.recording = false; const b = new Blob(chunks, { type: 'video/webm' }); uploadEvidence('clip', b, { kind: kind + '_clip', severity: 'info', detail: { seconds: 12 } }); };
    rec.start(); setTimeout(() => rec.state !== 'inactive' && rec.stop(), 12000);
  } catch (e) { XS.recording = false; }
}

function initProctoring() {
  XS.scrVideo = document.createElement('video'); XS.scrVideo.muted = true; XS.scrVideo.playsInline = true; XS.scrVideo.srcObject = XS.screen; XS.scrVideo.play().catch(() => { });
  XS.screen.getVideoTracks()[0].onended = onScreenEnded;
  watchCam();
  // focus, visibility, fullscreen
  const onVis = () => { if (XS.ended) return; if (document.hidden) { XS.hiddenAt = Date.now(); flagWithEvidence('left_exam_tab', 'high', {}, { screen: true }); } else if (XS.hiddenAt) { logEv('returned_to_tab', 'warn', { seconds: Math.round((Date.now() - XS.hiddenAt) / 1000) }); XS.hiddenAt = null; reshuffle('you left the exam screen'); } };
  const onBlur = () => { if (XS.ended) return; XS.blurAt = Date.now(); setTimeout(() => { if (XS.blurAt && !document.hasFocus() && !document.hidden && once('blur', 20000)) flagWithEvidence('focus_left_exam', 'warn', { note: 'Clicked outside the exam (another window or app)' }, { screen: true }); }, 2500); };
  const onFocus = () => { if (XS.blurAt) { const s = Math.round((Date.now() - XS.blurAt) / 1000); if (s >= 3) { logEv('focus_returned', 'info', { seconds: s }); reshuffle('you clicked outside the exam window'); } XS.blurAt = null; } };
  const onFs = () => { if (XS.ended) return; if (!document.fullscreenElement) { logEv('fullscreen_exit', 'warn'); } checkLocks(); };
  const onScr = () => { if (screen.isExtended && once('mon', 30000)) flagWithEvidence('second_monitor_connected', 'high', {}, { screen: true }); };
  const onResize = () => { if (once('rs', 15000) && window.outerWidth - window.innerWidth > 200) logEv('window_resized', 'info', { note: 'Possible developer tools or side panel' }); };
  document.addEventListener('visibilitychange', onVis); window.addEventListener('blur', onBlur); window.addEventListener('focus', onFocus);
  document.addEventListener('fullscreenchange', onFs); window.addEventListener('resize', onResize);
  if (screen.addEventListener) screen.addEventListener('change', onScr);
  window.addEventListener('online', () => { logEv('back_online', 'info'); saveNow(); });
  window.addEventListener('offline', () => { XS.offAt = Date.now(); toast('You are offline. Keep working; your answers will save when you reconnect.', 'bad'); });
  S.cleanup.push(() => { document.removeEventListener('visibilitychange', onVis); window.removeEventListener('blur', onBlur); window.removeEventListener('focus', onFocus); document.removeEventListener('fullscreenchange', onFs); window.removeEventListener('resize', onResize); if (screen.removeEventListener) screen.removeEventListener('change', onScr); });
  checkLocks();
  // loops
  const snapSec = Math.max(10, (XS.examMeta.settings && XS.examMeta.settings.snapshot_sec) || 30);
  XS.loops = [

    setInterval(() => flushEvents(), 10000),
    setInterval(() => { drawStatus(); drawPhone(); checkLocks(); }, 5000),
    setInterval(async () => { if (XS.ended) return; const [c, s] = await Promise.all([frameJpeg($('#selfCam'), 320, 0.55), frameJpeg(XS.scrVideo, 1024, 0.5)]); uploadEvidence('snapshot_cam', c); uploadEvidence('snapshot_screen', s); }, snapSec * 1000),
    setInterval(() => { if (XS.phonePaired && !phoneOk() && once('phonegone', 120000)) logEv('phone_camera_offline', 'warn'); }, 30000),
  ];
  startAudioWatch();

function startAudioWatch() {
  if (XS.audio) XS.audio.stop();

  XS.audio = micMeter(XS.cam, v => {
    if (XS.ended) return;
    if (base.length < 600) { base.push(v); return; }
    const sorted = XS._bs || (XS._bs = base.slice().sort((a, b) => a - b));
    const thr = Math.max(0.03, sorted[Math.floor(sorted.length * 0.9)] * 3);

async function startFaceWatch() {
  try {
    const V = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
    const vision = await import(V + '/vision_bundle.mjs');
    const files = await vision.FilesetResolver.forVisionTasks(V + '/wasm');
    const det = await vision.FaceDetector.createFromOptions(files, { baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite', delegate: 'CPU' }, runningMode: 'VIDEO', minDetectionConfidence: 0.55 });
    let none = 0, many = 0, away = 0, stop = false;
    XS.faceStop = () => { stop = true; try { det.close(); } catch (e) { } };
    const loop = () => {
      if (stop || XS.ended) return;
      const v = $('#selfCam');
      if (v && v.readyState >= 2) {
        try {
          const r = det.detectForVideo(v, performance.now());
          const n = r.detections.length;
          none = n === 0 ? none + 1 : 0;
          many = n > 1 ? many + 1 : 0;
          if (n === 1) { const b = r.detections[0].boundingBox; const cx = (b.originX + b.width / 2) / v.videoWidth; away = (cx < 0.18 || cx > 0.82) ? away + 1 : 0; } else away = 0;

          if (many === 2 && once('many', 45000)) flagWithEvidence('more_than_one_person', 'high', { faces: n }, { clip: true });
          if (away === 8 && once('away', 60000)) flagWithEvidence('face_turned_away', 'warn', {});
        } catch (e) { }
      }
      setTimeout(loop, 1600);
    };
    loop();
    logEv('face_monitor_on', 'info');
  } catch (e) { logEv('face_monitor_unavailable', 'info', { error: String(e.message || e).slice(0, 120) }); }
}
function onCopy(e) { const s = String(window.getSelection() || '') || (e.target && e.target.value ? e.target.value.substring(e.target.selectionStart, e.target.selectionEnd) : ''); XS.lastInternalCopy = s; }

      <video id="pv" autoplay muted playsinline></video>
      <div class="card" style="margin-top:12px"><b>Set-up</b><ul style="padding-left:18px;margin:6px 0 0"><li>Place the phone on a stand to your side, about 1 m away.</li><li>The view must show you, your hands, your desk and your laptop screen.</li><li>Do not touch the phone during the exam. Movement is detected and recorded.</li><li>Keep this page open and the screen on.</li></ul>
      <div class="row" style="margin-top:10px"><button class="btn sm ghost" id="flip">Switch camera</button></div></div>`;
    $('#pv').srcObject = P.stream;
    let facing = 'environment';
    $('#flip').onclick = async () => {
      facing = facing === 'environment' ? 'user' : 'environment';
      try { const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: facing }, width: { ideal: 640 }, height: { ideal: 480 } }, audio: false }); P.stream.getTracks().forEach(t => t.stop()); P.stream = s; $('#pv').srcObject = s; P.live.setStreams({ cam: s }); } catch (e) { toast('Could not switch camera', 'bad'); }
    };
    // keep screen awake
    const wake = async () => { try { P.lock = await navigator.wakeLock.request('screen'); } catch (e) { } };
    wake(); document.addEventListener('visibilitychange', () => { if (!document.hidden) wake(); });
    // live
    P.live = new LiveSender({ examId: P.info.exam_id, attemptId: P.info.attempt_id, role: 'phone', name: P.info.learner_name });
    P.live.setStreams({ cam: P.stream });
    P.live.on('end', () => send([{ kind: 'heartbeat' }]));
    P.live.start();
    // heartbeat + snapshots
    send([{ kind: 'phone_camera_on', severity: 'info', detail: { ua: navigator.userAgent, motion: P.motion } }].concat(P.motion === 'denied' ? [{ kind: 'phone_motion_sensor_blocked', severity: 'warn', detail: { note: 'Motion access was refused, so phone pick-up cannot be detected' } }] : []));
    setInterval(() => !P.ended && send([{ kind: 'heartbeat' }]), 15000);
    setInterval(async () => { if (P.ended) return; const b = await frameJpeg($('#pv'), 480, 0.55); if (b) fn('phone_upload', { code: P.code, kind: 'snapshot_phone', content_type: 'image/jpeg', data_base64: await blobToB64(b) }).catch(() => { }); }, Math.max(15, P.info.snapshot_sec || 30) * 1000);
    // page hidden = learner switched app on phone
    document.addEventListener('visibilitychange', () => {
      if (P.ended) return;
      if (document.hidden) { P.hiddenAt = Date.now(); send([{ kind: 'phone_page_hidden', severity: 'high', detail: { note: 'Learner left the camera page on the phone (switched app or locked phone)' } }]); P.live && P.live.flag({ kind: 'phone_page_hidden', severity: 'high' }); }
      else if (P.hiddenAt) { send([{ kind: 'phone_page_returned', severity: 'warn', detail: { seconds: Math.round((Date.now() - P.hiddenAt) / 1000) } }]); P.hiddenAt = null; }
    });
    // movement detection (phone picked up or moved)
    let baseG = null, moved = 0, lastFlag = 0;
    window.addEventListener('devicemotion', e => {
      if (P.ended) return;
      const g = e.accelerationIncludingGravity; if (!g || g.x == null) return;
      const a = e.acceleration || {};
      const lin = Math.sqrt((a.x || 0) ** 2 + (a.y || 0) ** 2 + (a.z || 0) ** 2);
      if (!baseG) baseG = { x: g.x, y: g.y, z: g.z };
      const tilt = Math.sqrt((g.x - baseG.x) ** 2 + (g.y - baseG.y) ** 2 + (g.z - baseG.z) ** 2);
      if (lin > 1.6 || tilt > 3.5) moved++; else moved = Math.max(0, moved - 1);
      if (moved > 12 && Date.now() - lastFlag > 30000) {
        lastFlag = Date.now(); moved = 0;
        $('#st').className = 'bigstatus bad'; $('#st').textContent = 'Movement detected and recorded';
        setTimeout(() => { if (!P.ended) { $('#st').className = 'bigstatus ok'; $('#st').textContent = 'Side camera is on'; } }, 6000);
        flag('phone_moved_or_picked_up', 'high', { tilt: +tilt.toFixed(2), accel: +lin.toFixed(2) });
        setTimeout(() => { baseG = null; }, 4000);
      }
    });
    window.addEventListener('orientationchange', () => !P.ended && flag('phone_orientation_changed', 'warn', {}));
    P.stream.getVideoTracks()[0].onended = () => !P.ended && send([{ kind: 'phone_camera_stopped', severity: 'high' }]);
  };
  const finish = () => {
    if (P.ended) return; P.ended = true;
    if (P.live) P.live.stop(); if (P.stream) P.stream.getTracks().forEach(t => t.stop()); try { P.lock && P.lock.release(); } catch (e) { }
    body.innerHTML = '<div class="card"><h2>The exam has ended</h2><p>You can close this page.</p></div>';
  };
  step1();
  if (code.length === 8) setTimeout(() => $('#pc').focus(), 100);
}

        <div class="thumbs">${list.map(f => { const ts = (f.name.match(/^(\d{4}-\d\d-\d\dT[\d-]+)/) || [])[1]; const lbl = ts ? fmtT(ts.slice(0, 10) + 'T' + ts.slice(11, 19).replace(/-/g, ':') + 'Z') : ''; return f.name.endsWith('.webm') ? `<div><video src="${urls[f.path]}" controls style="width:240px;border-radius:6px"></video><br><small>${lbl}</small></div>` : `<div><img src="${urls[f.path]}" onclick="window.open(this.src)" style="width:${filter === 'snapshot_screen' ? 260 : 160}px"><br><small>${lbl}</small></div>`; }).join('') || '<p class="muted">None.</p>'}</div>`;
      $$('[data-k]', body).forEach(b => b.onclick = () => { filter = b.dataset.k; draw(); });
